<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munkaidő</title>
    <style>
        :root {
            --bg: #0f0f0f; --card: #1a1a1a; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .container { max-width: 450px; margin: auto; background: var(--card); padding: 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; border: 1px solid var(--border); }
        h1 { font-size: 24px; margin-bottom: 30px; }
        
        /* Főmenü gombok */
        .main-btn { display: flex; align-items: center; justify-content: center; background: #262626; color: white; padding: 20px; margin: 15px auto; border: 1px solid var(--border); border-radius: 16px; font-size: 16px; font-weight: 500; transition: all 0.2s ease; width: 100%; cursor: pointer; }
        .main-btn:active { transform: scale(0.98); background: #333; }
        .main-btn i { font-size: 20px; margin-right: 12px; font-style: normal; }

        /* Navigáció */
        .nav-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; background: #262626; padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border); }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; padding: 0 10px; }
        .nav-label { font-weight: 500; font-size: 14px; }

        /* Vízszintes napok */
        .week-container { display: flex; justify-content: space-between; gap: 5px; margin: 25px 0; overflow-x: auto; padding-bottom: 5px; }
        .day-box { flex: 1; display: flex; flex-direction: column; align-items: center; background: #262626; padding: 10px 5px; border-radius: 12px; border: 1px solid var(--border); min-width: 45px; }
        .day-name { font-size: 11px; font-weight: bold; color: var(--secondary); margin-bottom: 8px; }
        
        /* Checkbox stílus */
        input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: #30d158; }
        
        .date-display { font-size: 22px; font-weight: bold; margin: 20px 0; color: var(--accent); }
        .hidden { display: none; }
        .back-btn { background: transparent; color: var(--secondary); margin-top: 25px; border: 1px solid #333; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="main-menu">
    <h1>Munkaidő</h1>
    <button class="main-btn"><i>⏱️</i> MUNKAIDŐ (15p kerekítés)</button>
    <button class="main-btn"><i>⏳</i> MUNKAIDŐ (30p kerekítés)</button>
    <button class="main-btn" onclick="showPresence()"><i>📅</i> MUNKAIDŐ (jelenlét)</button>
</div>

<div class="container hidden" id="presence-screen">
    <div class="nav-row">
        <button class="nav-btn" onclick="changeYear(-1)">❮</button>
        <span class="nav-label" id="year-val"></span>
        <button class="nav-btn" onclick="changeYear(1)">❯</button>
    </div>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span class="nav-label" id="month-val"></span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeWeek(-1)">❮</button>
        <span class="nav-label" id="week-val"></span>
        <button class="nav-btn" onclick="changeWeek(1)">❯</button>
    </div>

    <div id="week-days-row" class="week-container">
        </div>

    <div class="date-display" id="date-info"></div>

    <button class="back-btn" onclick="showMenu()">Vissza</button>
</div>

<script>
    let currentDate = new Date();
    const dayShortNames = ["V", "H", "K", "Sze", "Cs", "P", "Szo"];
    const monthNames = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];

    function showMenu() {
        document.getElementById('presence-screen').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function showPresence() {
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('presence-screen').classList.remove('hidden');
        updateUI();
    }

    function changeYear(n) { currentDate.setFullYear(currentDate.getFullYear() + n); updateUI(); }
    function changeMonth(n) { currentDate.setMonth(currentDate.getMonth() + n); updateUI(); }
    function changeWeek(n) { currentDate.setDate(currentDate.getDate() + (n * 7)); updateUI(); }

    function getWeekNumber(date) {
        let t = new Date(date.getTime());
        t.setHours(0,0,0,0);
        t.setDate(t.getDate() + 3 - (t.getDay() + 6) % 7);
        let w1 = new Date(t.getFullYear(), 0, 4);
        return 1 + Math.round(((t.getTime() - w1.getTime()) / 86400000 - 3 + (w1.getDay() + 6) % 7) / 7);
    }

    function updateUI() {
        document.getElementById('year-val').innerText = currentDate.getFullYear();
        document.getElementById('month-val').innerText = monthNames[currentDate.getMonth()];
        document.getElementById('week-val').innerText = getWeekNumber(currentDate) + ". hét";
        document.getElementById('date-info').innerText = currentDate.toISOString().split('T')[0].replace(/-/g, '.');

        const row = document.getElementById('week-days-row');
        row.innerHTML = '';

        let startOfWeek = new Date(currentDate);
        let day = startOfWeek.getDay();
        let diff = startOfWeek.getDate() - day + (day === 0 ? -6 : 1);
        startOfWeek.setDate(diff);

        for (let i = 0; i < 7; i++) {
            let d = new Date(startOfWeek);
            d.setDate(startOfWeek.getDate() + i);
            let dayName = dayShortNames[d.getDay()];
            let dateKey = d.toISOString().split('T')[0];

            let dayBox = document.createElement('div');
            dayBox.className = 'day-box';
            dayBox.innerHTML = `
                <div class="day-name">${dayName}</div>
                <input type="checkbox" id="check-${dateKey}">
            `;
            row.appendChild(dayBox);
        }
    }
</script>

</body>
</html>
