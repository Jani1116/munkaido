<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munkaidő</title>
    <style>
        :root {
            --bg: #0f0f0f; --card: #1a1a1a; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text); }
        .container { max-width: 650px; margin: auto; background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
        
        .main-btn { display: flex; align-items: center; justify-content: center; background: #262626; color: white; padding: 20px; margin: 15px auto; border: 1px solid var(--border); border-radius: 16px; font-size: 16px; width: 100%; cursor: pointer; }
        .nav-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; background: #262626; padding: 10px 15px; border-radius: 12px; }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; }

        .content-layout { display: flex; gap: 15px; margin-top: 20px; text-align: left; }
        .calendar-side { flex: 3; }
        .calc-side { flex: 2; background: #262626; padding: 15px; border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }

        .calendar-grid { display: grid; grid-template-columns: 35px repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .grid-header { font-size: 10px; font-weight: bold; color: var(--accent); text-align: center; }
        .week-num { font-size: 10px; color: var(--secondary); align-self: center; text-align: center; border-right: 1px solid var(--border); }
        
        /* Nap kocka */
        .day-cell { 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #1f1f1f; min-height: 50px; border-radius: 8px; font-size: 12px; border: 1px solid #2c2c2c; cursor: pointer;
        }
        .day-val { font-size: 14px; font-weight: bold; color: #30d158; margin-top: 2px; }

        /* Modális ablak */
        #time-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 24px; border: 1px solid var(--border); width: 80%; max-width: 300px; text-align: center; }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--border); color: white; border-radius: 8px; font-size: 18px; text-align: center; }
        .modal-btn { background: var(--accent); color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; margin-top: 10px; font-size: 16px; }

        .salary-input { background: #000; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; width: 100%; text-align: right; box-sizing: border-box; }
        .result-val { font-size: 24px; font-weight: bold; color: #30d158; }
        .hidden { display: none; }
        .back-btn { background: transparent; color: var(--secondary); margin-top: 25px; border: 1px solid #333; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

<div id="page-main" class="container">
    <h1>Munkaidő</h1>
    <button class="main-btn" onclick="openPage('round15')"><i>⏱️</i> Munkaidő (15p kerekítéssel)</button>
    <button class="main-btn" onclick="openPage('round30')"><i>⏳</i> Munkaidő (30p kerekítéssel)</button>
    <button class="main-btn" onclick="openPage('presence')"><i>📅</i> Munkaidő (jelenlét)</button>
</div>

<div id="page-view" class="container hidden">
    <h1 id="view-title">Cím</h1>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeYear(-1)">❮</button>
        <span id="year-display"></span>
        <button class="nav-btn" onclick="changeYear(1)">❯</button>
    </div>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span id="month-display"></span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <div class="content-layout">
        <div class="calendar-side">
            <div class="calendar-grid" id="calendar-body"></div>
        </div>
        <div class="calc-side">
            <span id="wage-label" style="font-size: 11px; color: var(--secondary);">BÉR</span>
            <input type="text" class="salary-input" id="wage-input" value="0" oninput="formatCurrency(this); calculateTotal();">
            <span id="total-label" style="font-size: 11px; color: var(--secondary);">ÖSSZES</span>
            <div id="total-count" style="font-size: 20px; font-weight: bold;">0</div>
            <span style="font-size: 11px; color: var(--secondary);">HAVI FIZETÉS</span>
            <div class="result-val" id="total-money">0 Ft</div>
        </div>
    </div>
    <button class="back-btn" onclick="backToMenu()">Vissza</button>
</div>

<div id="time-modal">
    <div class="modal-content">
        <h3 id="modal-date">Dátum</h3>
        <label>Érkezés</label>
        <input type="time" id="start-time">
        <label>Távozás</label>
        <input type="time" id="end-time">
        <button class="modal-btn" onclick="saveTime()">Mentés</button>
        <button class="back-btn" onclick="closeModal()">Mégse</button>
    </div>
</div>

<script>
    let d = new Date();
    let mode = 'presence'; // round15, round30, presence
    let selectedDay = null;
    let workData = {}; // Itt tároljuk az órákat nap szerint

    function openPage(m) {
        mode = m;
        document.getElementById('page-main').classList.add('hidden');
        document.getElementById('page-view').classList.remove('hidden');
        
        if(mode === 'presence') {
            document.getElementById('view-title').innerText = "Munkaidő (jelenlét)";
            document.getElementById('wage-label').innerText = "NAPI FIZETÉS (FT)";
            document.getElementById('total-label').innerText = "NAPOK SZÁMA";
        } else {
            document.getElementById('view-title').innerText = mode === 'round15' ? "Munkaidő (15p)" : "Munkaidő (30p)";
            document.getElementById('wage-label').innerText = "ÓRABÉR (FT)";
            document.getElementById('total-label').innerText = "ÖSSZES ÓRA";
        }
        render();
    }

    function backToMenu() {
        document.getElementById('page-view').classList.add('hidden');
        document.getElementById('page-main').classList.remove('hidden');
    }

    function changeMonth(n) { d.setMonth(d.getMonth() + n); render(); }
    function changeYear(n) { d.setFullYear(d.getFullYear() + n); render(); }

    function render() {
        const months = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];
        document.getElementById('year-display').innerText = d.getFullYear();
        document.getElementById('month-display').innerText = months[d.getMonth()];
        
        const body = document.getElementById('calendar-body');
        body.innerHTML = '<div class="grid-header"></div>' + ["H", "K", "Sze", "Cs", "P", "Szo", "V"].map(h => `<div class="grid-header">${h}</div>`).join('');

        let firstDay = new Date(d.getFullYear(), d.getMonth(), 1);
        let lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        let startShift = (firstDay.getDay() + 6) % 7;
        let dateCounter = 1;

        for (let row = 0; row < 6; row++) {
            if (dateCounter > lastDay.getDate()) break;
            let weekDate = new Date(d.getFullYear(), d.getMonth(), dateCounter);
            body.innerHTML += `<div class="week-num">${getWeekNum(weekDate)}</div>`;

            for (let col = 0; col < 7; col++) {
                if ((row === 0 && col < startShift) || dateCounter > lastDay.getDate()) {
                    body.innerHTML += `<div></div>`;
                } else {
                    let dateKey = `${d.getFullYear()}-${d.getMonth()}-${dateCounter}`;
                    let displayVal = workData[dateKey] || "";
                    
                    // Jelenlét módban pipa vagy üres
                    if(mode === 'presence' && displayVal !== "") displayVal = "✓";

                    body.innerHTML += `
                        <div class="day-cell" onclick="dayClick(${dateCounter})">
                            ${dateCounter}
                            <div class="day-val" id="val-${dateKey}">${displayVal}</div>
                        </div>`;
                    dateCounter++;
                }
            }
        }
        calculateTotal();
    }

    function dayClick(day) {
        selectedDay = day;
        let dateKey = `${d.getFullYear()}-${d.getMonth()}-${day}`;
        if(mode === 'presence') {
            workData[dateKey] = (workData[dateKey] === 1) ? "" : 1;
            render();
        } else {
            document.getElementById('modal-date').innerText = `${d.getFullYear()}. ${d.getMonth()+1}. ${day}.`;
            document.getElementById('time-modal').style.display = 'flex';
        }
    }

    function saveTime() {
        let start = document.getElementById('start-time').value;
        let end = document.getElementById('end-time').value;
        if(start && end) {
            let s = start.split(':'), e = end.split(':');
            let diff = (parseInt(e[0])*60 + parseInt(e[1])) - (parseInt(s[0])*60 + parseInt(s[1]));
            if(diff > 0) {
                let step = mode === 'round15' ? 15 : 30;
                let rounded = roundLogic(diff, step);
                workData[`${d.getFullYear()}-${d.getMonth()}-${selectedDay}`] = (rounded / 60).toFixed(2);
            }
        }
        closeModal();
        render();
    }

    function roundLogic(m, step) {
        let hrs = Math.floor(m / 60), mins = m % 60;
        if(step === 15) {
            if(mins >= 53) { hrs++; mins=0; } else if(mins >= 38) mins=45; else if(mins >= 23) mins=30; else if(mins >= 8) mins=15; else mins=0;
        } else {
            if(mins >= 46) { hrs++; mins=0; } else if(mins >= 16) mins=30; else mins=0;
        }
        return hrs * 60 + mins;
    }

    function calculateTotal() {
        let total = 0;
        for(let key in workData) {
            if(key.startsWith(`${d.getFullYear()}-${d.getMonth()}-`)) {
                total += parseFloat(workData[key] || 0);
            }
        }
        document.getElementById('total-count').innerText = mode === 'presence' ? total : total.toFixed(2);
        let wage = parseInt(document.getElementById('wage-input').value.replace(/\s/g, "")) || 0;
        document.getElementById('total-money').innerText = Math.round(total * wage).toLocaleString('hu-HU') + " Ft";
    }

    function closeModal() { document.getElementById('time-modal').style.display = 'none'; }
    function formatCurrency(i) { i.value = i.value.replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
    function getWeekNum(date) {
        let t = new Date(date.valueOf());
        t.setDate(t.getDate() - ((date.getDay() + 6) % 7) + 3);
        let f = t.valueOf();
        t.setMonth(0, 1);
        if (t.getDay() !== 4) t.setMonth(0, 1 + ((4 - t.getDay()) + 7) % 7);
        return 1 + Math.ceil((f - t) / 604800000);
    }
</script>
</body>
</html>
