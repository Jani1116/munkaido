<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munkaidő</title>
    <style>
        :root {
            --bg: #0f0f0f; --card: #1a1a1a; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text); }
        .container { max-width: 600px; margin: auto; background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
        h1 { font-size: 22px; margin-bottom: 25px; }
        
        .main-btn { display: flex; align-items: center; justify-content: center; background: #262626; color: white; padding: 18px; margin: 12px auto; border: 1px solid var(--border); border-radius: 16px; font-size: 16px; width: 100%; cursor: pointer; transition: 0.2s; }
        .main-btn:active { transform: scale(0.98); }

        .nav-row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; background: #262626; padding: 8px 15px; border-radius: 12px; }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; }

        /* Naptár és Kalkulátor Elrendezés */
        .content-layout { display: flex; gap: 20px; margin-top: 20px; text-align: left; }
        .calendar-side { flex: 2; }
        .calc-side { flex: 1; background: #262626; padding: 15px; border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }

        /* Naptár Grid */
        .calendar-grid { display: grid; grid-template-columns: 30px repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .grid-header { font-size: 10px; font-weight: bold; color: var(--accent); text-align: center; }
        .week-num { font-size: 10px; color: var(--secondary); align-self: center; }
        .day-cell { display: flex; flex-direction: column; align-items: center; background: #1f1f1f; padding: 5px 2px; border-radius: 8px; font-size: 12px; }
        .day-cell input { margin-top: 4px; width: 16px; height: 16px; accent-color: #30d158; }

        /* Kalkulátor */
        .calc-label { font-size: 11px; color: var(--secondary); text-transform: uppercase; }
        .salary-input { background: #000; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 8px; width: 80%; font-size: 14px; }
        .result-val { font-size: 20px; font-weight: bold; color: #30d158; }

        .hidden { display: none; }
        .back-btn { background: transparent; color: var(--secondary); margin-top: 20px; border: 1px solid #333; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="main-menu">
    <h1>Munkaidő</h1>
    <button class="main-btn" onclick="showSubMenu()">📊 ÖSSZEGZÉS</button>
</div>

<div class="container hidden" id="sub-menu">
    <h1>Összegzés</h1>
    <button class="main-btn">⏱️ Munkaidő (15p kerekítéssel)</button>
    <button class="main-btn">⏳ Munkaidő (30p kerekítéssel)</button>
    <button class="main-btn" onclick="showPresence()">📅 Munkaidő (jelenlét)</button>
    <button class="back-btn" onclick="showMain()">Vissza</button>
</div>

<div class="container hidden" id="presence-screen">
    <h1>Munkaidő (jelenlét)</h1>
    
    <div class="nav-row">
        <button class="nav-btn" onclick="changeYear(-1)">❮</button>
        <span id="year-val">2026</span>
        <button class="nav-btn" onclick="changeYear(1)">❯</button>
    </div>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span id="month-val">Január</span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <div class="content-layout">
        <div class="calendar-side">
            <div class="calendar-grid" id="calendar-body">
                </div>
        </div>

        <div class="calc-side">
            <span class="calc-label">Napi fizetés</span>
            <div>
                <input type="text" class="salary-input" id="daily-wage" value="0" oninput="formatCurrency(this); calculateSalary();"> Ft
            </div>
            
            <span class="calc-label">Ledolgozott napok</span>
            <div id="day-count" style="font-weight: bold;">0</div>

            <span class="calc-label">Havi fizetés</span>
            <div class="result-val" id="monthly-salary">0 Ft</div>
        </div>
    </div>

    <button class="back-btn" onclick="showSubMenu()">Vissza</button>
</div>

<script>
    let d = new Date();
    const months = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];
    const days = ["H", "K", "Sze", "Cs", "P", "Szo", "V"];

    function showMain() { hideAll(); document.getElementById('main-menu').classList.remove('hidden'); }
    function showSubMenu() { hideAll(); document.getElementById('sub-menu').classList.remove('hidden'); }
    function showPresence() { hideAll(); document.getElementById('presence-screen').classList.remove('hidden'); renderCalendar(); }
    function hideAll() { ['main-menu', 'sub-menu', 'presence-screen'].forEach(id => document.getElementById(id).classList.add('hidden')); }

    function changeYear(n) { d.setFullYear(d.getFullYear() + n); renderCalendar(); }
    function changeMonth(n) { d.setMonth(d.getMonth() + n); renderCalendar(); }

    function formatCurrency(input) {
        let val = input.value.replace(/\D/g, "");
        input.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function getWeekNumber(date) {
        let t = new Date(date.valueOf());
        let dayn = (date.getDay() + 6) % 7;
        t.setDate(t.getDate() - dayn + 3);
        let firstThursday = t.valueOf();
        t.setMonth(0, 1);
        if (t.getDay() !== 4) t.setMonth(0, 1 + ((4 - t.getDay()) + 7) % 7);
        return 1 + Math.ceil((firstThursday - t) / 604800000);
    }

    function renderCalendar() {
        document.getElementById('year-val').innerText = d.getFullYear();
        document.getElementById('month-val').innerText = months[d.getMonth()];
        const body = document.getElementById('calendar-body');
        body.innerHTML = '<div class="grid-header"></div>' + days.map(day => `<div class="grid-header">${day}</div>`).join('');

        let firstDay = new Date(d.getFullYear(), d.getMonth(), 1);
        let lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        
        let startShift = (firstDay.getDay() + 6) % 7;
        let dateCounter = 1;

        for (let row = 0; row < 6; row++) {
            let weekDate = new Date(d.getFullYear(), d.getMonth(), dateCounter);
            if (dateCounter > lastDay.getDate()) break;
            
            body.innerHTML += `<div class="week-num">${getWeekNumber(weekDate)}</div>`;

            for (let col = 0; col < 7; col++) {
                if ((row === 0 && col < startShift) || dateCounter > lastDay.getDate()) {
                    body.innerHTML += `<div></div>`;
                } else {
                    body.innerHTML += `
                        <div class="day-cell">
                            ${dateCounter}
                            <input type="checkbox" onchange="calculateSalary()">
                        </div>`;
                    dateCounter++;
                }
            }
        }
        calculateSalary();
    }

    function calculateSalary() {
        const checks = document.querySelectorAll('#calendar-body input[type="checkbox"]:checked').length;
        const wage = parseInt(document.getElementById('daily-wage').value.replace(/\s/g, "")) || 0;
        document.getElementById('day-count').innerText = checks;
        const total = checks * wage;
        document.getElementById('monthly-salary').innerText = total.toLocaleString('hu-HU') + " Ft";
    }
</script>
</body>
</html>
