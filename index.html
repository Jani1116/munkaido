<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munkaidő</title>
    <style>
        :root {
            --bg: #0f0f0f; --card: #1a1a1a; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); }
        .container { max-width: 800px; margin: auto; background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
        
        .main-btn { display: flex; align-items: center; justify-content: center; background: #262626; color: white; padding: 18px; margin: 10px auto; border: 1px solid var(--border); border-radius: 16px; font-size: 16px; width: 100%; cursor: pointer; }
        .nav-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #262626; padding: 10px; border-radius: 12px; }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; }

        /* Kerekítés táblázat */
        .work-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .work-table th { color: var(--secondary); padding: 10px; font-weight: normal; border-bottom: 1px solid var(--border); }
        .work-table td { padding: 8px 5px; border-bottom: 1px solid #222; }
        
        .time-input { background: #000; border: 1px solid var(--border); color: white; padding: 5px; border-radius: 6px; width: 60px; text-align: center; }
        .res-cell { color: #30d158; font-weight: bold; }

        /* Összesítő sáv */
        .summary-bar { display: flex; justify-content: space-around; background: #262626; padding: 15px; border-radius: 16px; margin-top: 20px; border: 1px solid var(--border); }
        .sum-item { display: flex; flex-direction: column; }
        .sum-label { font-size: 11px; color: var(--secondary); text-transform: uppercase; }
        .sum-val { font-size: 18px; font-weight: bold; color: #30d158; }

        .hidden { display: none; }
        .back-btn { background: transparent; color: var(--secondary); margin-top: 20px; border: 1px solid #333; width: 100%; padding: 10px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="main-menu">
    <h1>Munkaidő</h1>
    <button class="main-btn"><i>📊</i> ÖSSZEGZÉS</button>
    <button class="main-btn" onclick="showWorkView(15)"><i>⏱️</i> MUNKAIDŐ (15p kerekítéssel)</button>
    <button class="main-btn" onclick="showWorkView(30)"><i>⏳</i> MUNKAIDŐ (30p kerekítéssel)</button>
    <button class="main-btn" onclick="alert('Jelenlét nézet...')"><i>📅</i> MUNKAIDŐ (jelenlét)</button>
</div>

<div class="container hidden" id="work-view">
    <h1 id="view-title">Kerekítés</h1>
    
    <div class="nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span id="month-display">Január</span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <table class="work-table">
        <thead>
            <tr>
                <th>Nap</th>
                <th>Érkezés</th>
                <th>Távozás</th>
                <th>Kerekített óra</th>
            </tr>
        </thead>
        <tbody id="table-body">
            </tbody>
    </table>

    <div class="summary-bar">
        <div class="sum-item">
            <span class="sum-label">Órabér (Ft)</span>
            <input type="number" id="hourly-wage" value="2000" style="width:70px; background:none; border:1px solid #444; color:white; border-radius:4px;" oninput="calculateAll()">
        </div>
        <div class="sum-item">
            <span class="sum-label">Összes óra</span>
            <span class="sum-val" id="total-hours">0</span>
        </div>
        <div class="sum-item">
            <span class="sum-label">Havi fizetés</span>
            <span class="sum-val" id="total-money">0 Ft</span>
        </div>
    </div>

    <button class="back-btn" onclick="location.reload()">Vissza</button>
</div>

<script>
    let currentRounding = 15;
    let d = new Date();
    const months = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];

    function showWorkView(round) {
        currentRounding = round;
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('work-view').classList.remove('hidden');
        document.getElementById('view-title').innerText = `Munkaidő (${round}p)`;
        renderTable();
    }

    function changeMonth(n) { d.setMonth(d.getMonth() + n); renderTable(); }

    function renderTable() {
        document.getElementById('month-display').innerText = months[d.getMonth()] + " " + d.getFullYear();
        const body = document.getElementById('table-body');
        body.innerHTML = "";
        
        let daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();

        for(let i = 1; i <= daysInMonth; i++) {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i}.</td>
                <td><input type="time" class="time-input start-t" onchange="calculateAll()"></td>
                <td><input type="time" class="time-input end-t" onchange="calculateAll()"></td>
                <td class="res-cell">0.0</td>
            `;
            body.appendChild(tr);
        }
        calculateAll();
    }

    function calculateAll() {
        let totalHours = 0;
        const rows = document.querySelectorAll('#table-body tr');
        
        rows.forEach(row => {
            const start = row.querySelector('.start-t').value;
            const end = row.querySelector('.end-t').value;
            const resCell = row.querySelector('.res-cell');

            if(start && end) {
                let s = start.split(':');
                let e = end.split(':');
                let diffMin = (parseInt(e[0])*60 + parseInt(e[1])) - (parseInt(s[0])*60 + parseInt(s[1]));
                
                if(diffMin > 0) {
                    // Kerekítés
                    let roundedMin = Math.round(diffMin / currentRounding) * currentRounding;
                    let decimalHours = roundedMin / 60;
                    resCell.innerText = decimalHours.toFixed(2);
                    totalHours += decimalHours;
                }
            }
        });

        document.getElementById('total-hours').innerText = totalHours.toFixed(2);
        let wage = document.getElementById('hourly-wage').value;
        document.getElementById('total-money').innerText = Math.round(totalHours * wage).toLocaleString() + " Ft";
    }
</script>
</body>
</html>
