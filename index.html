<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munkaidő PRO</title>
    <style>
        :root { --bg:#000; --card:#1c1c1e; --accent:#007aff; --success:#30d158; --extra:#bf5af2; --border:#2c2c2e; --text:#fff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; background: #121212; padding: 20px; border-radius: 20px; border: 1px solid var(--border); min-height: 90vh; }
        .main-btn { background: var(--card); color: white; padding: 15px; margin: 10px 0; border: 1px solid var(--border); border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 20px 0; }
        .day-cell { background: var(--card); padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; min-height: 50px; }
        .annual-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 20px; }
        .annual-table th, .annual-table td { border-bottom: 1px solid #333; padding: 8px 2px; text-align: center; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 20px; width: 80%; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid var(--border); color: white; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="app" class="container">
    <div id="page-main">
        <h1>Főmenü</h1>
        <button class="main-btn" onclick="openPage('round15')">⏱️ 15p Kerekítés</button>
        <button class="main-btn" onclick="openPage('presence')">📅 Jelenlét (✓)</button>
        <button class="main-btn" onclick="openPage('extra')">💰 Extra bevétel</button>
        <button class="main-btn" onclick="openAnnualPage()">📊 Összesítő</button>
    </div>

    <div id="page-view" class="hidden">
        <button class="main-btn" onclick="backToMenu()">Vissza</button>
        <div id="month-display" style="text-align:center; margin:10px 0; font-weight:bold"></div>
        <div class="calendar-grid" id="calendar-body"></div>
        <input type="text" id="wage-input" placeholder="Órabér/Napidíj (Ft)" oninput="saveWages()">
    </div>

    <div id="page-annual" class="hidden">
        <button class="main-btn" onclick="backToMenu()">Vissza</button>
        <select id="year-select" onchange="renderAnnual()"></select>
        <div id="annual-data"></div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <input type="text" id="m-val1" placeholder="Érték 1">
        <input type="text" id="m-val2" placeholder="Érték 2">
        <button class="main-btn" onclick="saveData()">Mentés</button>
        <button class="main-btn" onclick="closeModal()">Mégse</button>
    </div>
</div>

<script>
    let workData = JSON.parse(localStorage.getItem('wData')) || {};
    let wages = JSON.parse(localStorage.getItem('wages')) || {};
    let mode = '', selectedDay = '', d = new Date();

    function openPage(m) { mode = m; document.getElementById('page-main').classList.add('hidden'); document.getElementById('page-view').classList.remove('hidden'); render(); }
    
    function render() {
        const body = document.getElementById('calendar-body');
        body.innerHTML = '';
        let lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        for(let i=1; i<=lastDay; i++) {
            let div = document.createElement('div');
            div.className = 'day-cell';
            div.innerHTML = i;
            div.onclick = () => dayClick(i);
            body.appendChild(div);
        }
        document.getElementById('month-display').innerText = d.toLocaleString('hu', {month:'long', year:'numeric'});
    }

    function dayClick(day) {
        selectedDay = day;
        if(mode === 'presence') { 
            let key = `presence_${d.getFullYear()}_${d.getMonth()}_${day}`;
            workData[key] = workData[key] ? null : 1;
            saveLocal(); render();
        } else { document.getElementById('modal').style.display = 'flex'; }
    }

    function saveData() {
        let key = `${mode}_${d.getFullYear()}_${d.getMonth()}_${selectedDay}`;
        workData[key] = { v1: document.getElementById('m-val1').value, v2: document.getElementById('m-val2').value, total: 8 }; 
        saveLocal(); closeModal();
    }

    function renderAnnual() {
        let y = document.getElementById('year-select').value;
        let html = '<table class="annual-table"><tr><th>Hó</th><th>15p (Ft)</th><th>Jel. (Ft)</th><th>Extra</th><th>Össz.</th></tr>';
        for(let m=0; m<12; m++) {
            let m15 = 0, mPres = 0, mExt = 0;
            // Számítások... (egyszerűsítve)
            html += `<tr><td>${m+1}</td><td>${m15}</td><td>${mPres}</td><td>${mExt}</td><td>${m15+mPres+mExt}</td></tr>`;
        }
        document.getElementById('annual-data').innerHTML = html + '</table>';
    }

    function saveLocal() { localStorage.setItem('wData', JSON.stringify(workData)); localStorage.setItem('wages', JSON.stringify(wages)); }
    function saveWages() { wages[`w_${d.getMonth()}_${mode}`] = document.getElementById('wage-input').value; saveLocal(); }
    function backToMenu() { document.getElementById('page-main').classList.remove('hidden'); document.getElementById('page-view').classList.add('hidden'); document.getElementById('page-annual').classList.add('hidden'); }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function openAnnualPage() { document.getElementById('page-main').classList.add('hidden'); document.getElementById('page-annual').classList.remove('hidden'); renderAnnual(); }
</script>
</body>
</html>
