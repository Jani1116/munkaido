<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munkaidő Digitális</title>
    <style>
        :root {
            --bg: #0f0f0f; --card: #1a1a1a; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
            --danger: #ff3b30;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); }
        .container { max-width: 500px; margin: auto; background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
        
        .main-btn { display: flex; align-items: center; justify-content: center; background: #262626; color: white; padding: 22px; margin: 15px auto; border: 1px solid var(--border); border-radius: 18px; font-size: 16px; width: 100%; cursor: pointer; transition: 0.2s; }
        .main-btn:active { transform: scale(0.97); }

        .nav-row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; background: #262626; padding: 12px 18px; border-radius: 14px; border: 1px solid var(--border); }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; padding: 5px 15px; }

        .calendar-grid { display: grid; grid-template-columns: 40px repeat(7, 1fr); gap: 6px; margin: 20px 0; width: 100%; }
        .grid-header { font-size: 11px; font-weight: bold; color: var(--accent); text-align: center; padding-bottom: 8px; }
        .week-num { font-size: 10px; color: var(--secondary); align-self: center; text-align: center; font-weight: bold; }
        
        .day-cell { 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #1f1f1f; min-height: 65px; border-radius: 12px; font-size: 14px; border: 1px solid #2c2c2c; cursor: pointer;
        }
        .day-val { font-size: 13px; font-weight: bold; color: #30d158; margin-top: 4px; }

        .summary-section { 
            background: #262626; padding: 20px; border-radius: 20px; border: 1px solid var(--border); 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-top: 10px;
        }
        .sum-box { display: flex; flex-direction: column; }
        .sum-full { grid-column: span 2; border-top: 1px solid #333; padding-top: 10px; }
        
        .salary-input { background: #000; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; width: 100%; font-size: 16px; box-sizing: border-box; }
        .result-val { font-size: 26px; font-weight: bold; color: #30d158; }

        #time-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #1a1a1a; padding: 25px; border-radius: 24px; border: 1px solid var(--border); width: 85%; max-width: 320px; text-align: left; }
        .modal-content label { color: var(--secondary); font-size: 14px; display: block; margin-top: 15px; }
        .modal-content input { 
            width: 100%; padding: 15px; margin: 8px 0; background: #000; border: 1px solid var(--border); 
            color: white; border-radius: 12px; font-size: 24px; text-align: center; box-sizing: border-box; 
        }
        .modal-btn { background: var(--accent); color: white; border: none; padding: 16px; width: 100%; border-radius: 14px; margin-top: 15px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .delete-btn { background: #3a3a3c; color: var(--danger); border: none; padding: 12px; width: 100%; border-radius: 14px; margin-top: 10px; font-size: 14px; cursor: pointer; }

        .hidden { display: none; }
        .back-btn { background: transparent; color: var(--secondary); margin-top: 20px; border: 1px solid #333; width: 100%; padding: 14px; border-radius: 14px; cursor: pointer; }
    </style>
</head>
<body>

<div id="page-main" class="container">
    <h1>Munkaidő</h1>
    <button class="main-btn" onclick="openPage('round15')">⏱️ Munkaidő (15p kerekítéssel)</button>
    <button class="main-btn" onclick="openPage('round30')">⏳ Munkaidő (30p kerekítéssel)</button>
    <button class="main-btn" onclick="openPage('presence')">📅 Munkaidő (jelenlét)</button>
</div>

<div id="page-view" class="container hidden">
    <h2 id="view-title"></h2>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeYear(-1)">❮</button>
        <span id="year-display"></span>
        <button class="nav-btn" onclick="changeYear(1)">❯</button>
    </div>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span id="month-display"></span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <div class="calendar-grid" id="calendar-body"></div>

    <div class="summary-section">
        <div class="sum-box">
            <span id="wage-label" style="font-size:11px; color:var(--secondary)">BÉR</span>
            <input type="text" class="salary-input" id="wage-input" value="0" oninput="formatCurrency(this); saveWage(); calculateTotal();">
        </div>
        <div class="sum-box">
            <span id="total-label" style="font-size:11px; color:var(--secondary)">ÖSSZES ÓRA</span>
            <div id="total-count" style="font-size: 24px; font-weight: bold;">0</div>
        </div>
        <div class="sum-box sum-full">
            <span style="font-size:11px; color:var(--secondary)">HAVI FIZETÉS</span>
            <div class="result-val" id="total-money">0 Ft</div>
        </div>
    </div>
    <button class="back-btn" onclick="backToMenu()">Vissza</button>
</div>

<div id="time-modal">
    <div class="modal-content">
        <h3 id="modal-date" style="text-align:center; margin-top:0"></h3>
        
        <label>Érkezés (óó:pp)</label>
        <input type="text" id="start-time" inputmode="numeric" placeholder="08:00" maxlength="5" onkeyup="timeMask(this)">
        
        <label>Távozás (óó:pp)</label>
        <input type="text" id="end-time" inputmode="numeric" placeholder="16:30" maxlength="5" onkeyup="timeMask(this)">
        
        <button class="modal-btn" onclick="saveTime()">MENTÉS</button>
        <button class="delete-btn" onclick="deleteEntry()">TÖRLÉS</button>
        <button class="back-btn" style="border:none" onclick="closeModal()">MÉGSE</button>
    </div>
</div>

<script>
    let d = new Date();
    let mode = 'presence';
    let selectedDay = null;
    const months = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];

    let workData = JSON.parse(localStorage.getItem('workData')) || {};
    let wages = JSON.parse(localStorage.getItem('wages')) || { 'presence': '0', 'round15': '0', 'round30': '0' };

    function timeMask(input) {
        let val = input.value.replace(/\D/g, "");
        if (val.length > 2) {
            input.value = val.substring(0, 2) + ":" + val.substring(2, 4);
        } else {
            input.value = val;
        }
    }

    function openPage(m) {
        mode = m;
        document.getElementById('page-main').classList.add('hidden');
        document.getElementById('page-view').classList.remove('hidden');
        document.getElementById('view-title').innerText = mode==='presence' ? "Jelenlét" : (mode==='round15' ? "15p Kerekítés" : "30p Kerekítés");
        document.getElementById('wage-input').value = wages[mode] || 0;
        render();
    }

    function backToMenu() {
        document.getElementById('page-view').classList.add('hidden');
        document.getElementById('page-main').classList.remove('hidden');
    }

    function saveWage() {
        wages[mode] = document.getElementById('wage-input').value;
        localStorage.setItem('wages', JSON.stringify(wages));
    }

    function render() {
        document.getElementById('year-display').innerText = d.getFullYear();
        document.getElementById('month-display').innerText = months[d.getMonth()];
        const body = document.getElementById('calendar-body');
        body.innerHTML = '<div class="grid-header"></div>' + ["H", "K", "Sze", "Cs", "P", "Szo", "V"].map(h => `<div class="grid-header">${h}</div>`).join('');

        let firstDay = new Date(d.getFullYear(), d.getMonth(), 1);
        let lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        let startShift = (firstDay.getDay() + 6) % 7;
        let dateCounter = 1;

        for (let row = 0; row < 6; row++) {
            if (dateCounter > lastDay.getDate()) break;
            body.innerHTML += `<div class="week-num">${getWeekNum(new Date(d.getFullYear(), d.getMonth(), dateCounter))}</div>`;
            for (let col = 0; col < 7; col++) {
                if ((row === 0 && col < startShift) || dateCounter > lastDay.getDate()) {
                    body.innerHTML += `<div></div>`;
                } else {
                    let key = `${mode}-${d.getFullYear()}-${d.getMonth()}-${dateCounter}`;
                    let val = workData[key] || "";
                    let display = (mode === 'presence' && val === 1) ? "✓" : (val ? val + "ó" : "");
                    body.innerHTML += `<div class="day-cell" onclick="dayClick(${dateCounter})">${dateCounter}<div class="day-val">${display}</div></div>`;
                    dateCounter++;
                }
            }
        }
        calculateTotal();
    }

    function dayClick(day) {
        selectedDay = day;
        let key = `${mode}-${d.getFullYear()}-${d.getMonth()}-${day}`;
        if(mode === 'presence') {
            workData[key] = workData[key] === 1 ? "" : 1;
            localStorage.setItem('workData', JSON.stringify(workData));
            render();
        } else {
            document.getElementById('modal-date').innerText = `${day}. ${months[d.getMonth()]}`;
            document.getElementById('start-time').value = "";
            document.getElementById('end-time').value = "";
            document.getElementById('time-modal').style.display = 'flex';
        }
    }

    function saveTime() {
        let s = document.getElementById('start-time').value, e = document.getElementById('end-time').value;
        let key = `${mode}-${d.getFullYear()}-${d.getMonth()}-${selectedDay}`;

        if(s.includes(':') && e.includes(':')) {
            let sParts = s.split(':'), eParts = e.split(':');
            let m = (parseInt(eParts[0])*60 + parseInt(eParts[1])) - (parseInt(sParts[0])*60 + parseInt(sParts[1]));
            
            if(m > 0) {
                let step = mode === 'round15' ? 15 : 30;
                let hrs = Math.floor(m / 60), mins = m % 60;
                if(step === 15) {
                    if(mins >= 53) { hrs++; mins=0; } else if(mins >= 38) mins=45; else if(mins >= 23) mins=30; else if(mins >= 8) mins=15; else mins=0;
                } else {
                    if(mins >= 46) { hrs++; mins=0; } else if(mins >= 16) mins=30; else mins=0;
                }
                workData[key] = ((hrs * 60 + mins) / 60).toFixed(2);
                localStorage.setItem('workData', JSON.stringify(workData));
            }
        }
        closeModal(); render();
    }

    function deleteEntry() {
        let key = `${mode}-${d.getFullYear()}-${d.getMonth()}-${selectedDay}`;
        delete workData[key];
        localStorage.setItem('workData', JSON.stringify(workData));
        closeModal(); render();
    }

    function calculateTotal() {
        let total = 0, prefix = `${mode}-${d.getFullYear()}-${d.getMonth()}-`;
        for(let k in workData) { if(k.startsWith(prefix)) total += parseFloat(workData[k] || 0); }
        document.getElementById('total-count').innerText = mode==='presence' ? total : total.toFixed(2);
        let w = parseInt(document.getElementById('wage-input').value.replace(/\s/g, "")) || 0;
        document.getElementById('total-money').innerText = Math.round(total * w).toLocaleString('hu-HU') + " Ft";
    }

    function closeModal() { document.getElementById('time-modal').style.display = 'none'; }
    function formatCurrency(i) { i.value = i.value.replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
    function changeMonth(n) { d.setMonth(d.getMonth() + n); render(); }
    function changeYear(n) { d.setFullYear(d.getFullYear() + n); render(); }
    function getWeekNum(date) {
        let t = new Date(date.valueOf()); t.setDate(t.getDate() - ((date.getDay() + 6) % 7) + 3);
        let f = t.valueOf(); t.setMonth(0, 1);
        if (t.getDay() !== 4) t.setMonth(0, 1 + ((4 - t.getDay()) + 7) % 7);
        return 1 + Math.ceil((f - t) / 604800000);
    }
</script>
</body>
</html>
