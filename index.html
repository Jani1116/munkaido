<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munkaidő</title>
    <style>
        :root {
            --bg: #0f0f0f; --card: #1a1a1a; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text); }
        .container { max-width: 800px; margin: auto; background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
        h1 { font-size: 24px; margin-bottom: 25px; }
        
        .main-btn { display: flex; align-items: center; justify-content: center; background: #262626; color: white; padding: 20px; margin: 15px auto; border: 1px solid var(--border); border-radius: 16px; font-size: 16px; font-weight: 500; width: 100%; cursor: pointer; transition: 0.2s; }
        .main-btn:active { transform: scale(0.98); }
        .main-btn i { font-size: 20px; margin-right: 12px; font-style: normal; }

        .nav-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; background: #262626; padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border); }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; }

        .hidden { display: none; }
        .back-btn { background: transparent; color: var(--secondary); margin-top: 25px; border: 1px solid #333; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; }

        /* JELENLÉT */
        .content-layout { display: flex; gap: 15px; margin-top: 20px; text-align: left; align-items: flex-start; }
        .calendar-side { flex: 3; }
        .calc-side { flex: 2; background: #262626; padding: 15px; border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
        .calendar-grid { display: grid; grid-template-columns: 35px repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .grid-header { font-size: 10px; font-weight: bold; color: var(--accent); text-align: center; padding-bottom: 5px; }
        .week-num { font-size: 10px; color: var(--secondary); align-self: center; text-align: center; font-weight: bold; border-right: 1px solid var(--border); }
        .day-cell { display: flex; flex-direction: column; align-items: center; background: #1f1f1f; padding: 6px 0; border-radius: 8px; font-size: 13px; border: 1px solid #2c2c2c; }
        .day-cell input[type="checkbox"] { margin-top: 5px; width: 18px; height: 18px; accent-color: #30d158; cursor: pointer; }

        /* KEREKÍTÉS */
        .work-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .work-table th { color: var(--secondary); padding: 10px; font-weight: normal; border-bottom: 1px solid var(--border); }
        .work-table td { padding: 10px 5px; border-bottom: 1px solid #222; }
        .time-input { background: #000; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 8px; width: 85px; text-align: center; font-size: 14px; }

        /* KALKULÁTOR */
        .calc-label { font-size: 11px; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .salary-input { background: #000; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; width: 100%; font-size: 16px; text-align: right; box-sizing: border-box; }
        .result-val { font-size: 24px; font-weight: bold; color: #30d158; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container" id="main-menu">
    <h1>Munkaidő</h1>
    <button class="main-btn" onclick="showRoundingView(15)"><i>⏱️</i> Munkaidő (15p kerekítéssel)</button>
    <button class="main-btn" onclick="showRoundingView(30)"><i>⏳</i> Munkaidő (30p kerekítéssel)</button>
    <button class="main-btn" onclick="showPresenceView()"><i>📅</i> Munkaidő (jelenlét)</button>
</div>

<div class="container hidden" id="rounding-screen">
    <h1 id="rounding-title">Kerekítés</h1>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span id="round-month-val" style="font-weight: bold;"></span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <div style="overflow-x:auto;">
        <table class="work-table">
            <thead>
                <tr>
                    <th>Nap</th>
                    <th>Érkezés</th>
                    <th>Távozás</th>
                    <th>Kerekített óra</th>
                </tr>
            </thead>
            <tbody id="rounding-table-body"></tbody>
        </table>
    </div>

    <div class="content-layout">
        <div class="calc-side" style="flex: 1; width: 100%;">
            <span class="calc-label">Órabér (Ft)</span>
            <input type="text" class="salary-input" id="hourly-wage" value="0" oninput="formatCurrency(this); calculateRoundingSalary();">
            <span class="calc-label">Összes ledolgozott óra:</span>
            <div id="total-hours" style="font-size: 20px; font-weight: bold;">0.00</div>
            <span class="calc-label">Havi fizetés:</span>
            <div class="result-val" id="rounding-monthly-salary">0 Ft</div>
        </div>
    </div>
    <button class="back-btn" onclick="backToMenu()">Vissza</button>
</div>

<div class="container hidden" id="presence-screen">
    <h1>Munkaidő (jelenlét)</h1>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeYear(-1)">❮</button>
        <span id="pres-year-val" style="font-weight: bold;"></span>
        <button class="nav-btn" onclick="changeYear(1)">❯</button>
    </div>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span id="pres-month-val" style="font-weight: bold;"></span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <div class="content-layout">
        <div class="calendar-side"><div class="calendar-grid" id="calendar-body"></div></div>
        <div class="calc-side">
            <span class="calc-label">Napi fizetés (Ft)</span>
            <input type="text" class="salary-input" id="daily-wage" value="0" oninput="formatCurrency(this); calculatePresenceSalary();">
            <span class="calc-label">Ledolgozott napok:</span>
            <div id="day-count" style="font-size: 20px; font-weight: bold;">0</div>
            <span class="calc-label">Havi fizetés:</span>
            <div class="result-val" id="pres-monthly-salary">0 Ft</div>
        </div>
    </div>
    <button class="back-btn" onclick="backToMenu()">Vissza</button>
</div>

<script>
    let d = new Date();
    let currentRounding = 15;
    const months = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];
    const daysArr = ["H", "K", "Sze", "Cs", "P", "Szo", "V"];

    function backToMenu() {
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function formatCurrency(input) {
        let val = input.value.replace(/\D/g, "");
        input.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function getWeekNumber(date) {
        let t = new Date(date.valueOf());
        t.setDate(t.getDate() - ((date.getDay() + 6) % 7) + 3);
        let firstThurs = t.valueOf();
        t.setMonth(0, 1);
        if (t.getDay() !== 4) t.setMonth(0, 1 + ((4 - t.getDay()) + 7) % 7);
        return 1 + Math.ceil((firstThurs - t) / 604800000);
    }

    // --- KEREKÍTÉSI LOGIKA ---
    function roundMinutes(totalMinutes, step) {
        let h = Math.floor(totalMinutes / 60);
        let m = totalMinutes % 60;
        
        if (step === 15) {
            if (m >= 53) { h++; m = 0; }
            else if (m >= 38) m = 45;
            else if (m >= 23) m = 30;
            else if (m >= 8) m = 15;
            else m = 0;
        } else if (step === 30) {
            if (m >= 46) { h++; m = 0; }
            else if (m >= 16) m = 30;
            else m = 0;
        }
        return h * 60 + m;
    }

    // --- KEREKÍTÉS NÉZET ---
    function showRoundingView(round) {
        currentRounding = round;
        backToMenu();
        document.getElementById('rounding-screen').classList.remove('hidden');
        document.getElementById('rounding-title').innerText = `Munkaidő (${round}p kerekítés)`;
        renderRoundingTable();
    }

    function renderRoundingTable() {
        document.getElementById('round-month-val').innerText = months[d.getMonth()] + " " + d.getFullYear();
        const body = document.getElementById('rounding-table-body');
        body.innerHTML = "";
        let daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();

        for(let i = 1; i <= daysInMonth; i++) {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i}.</td>
                <td><input type="time" class="time-input start-t" onchange="calculateRoundingSalary()"></td>
                <td><input type="time" class="time-input end-t" onchange="calculateRoundingSalary()"></td>
                <td class="res-cell" style="color:#30d158; font-weight:bold;">0.00</td>
            `;
            body.appendChild(tr);
        }
        calculateRoundingSalary();
    }

    function calculateRoundingSalary() {
        let totalHours = 0;
        document.querySelectorAll('#rounding-table-body tr').forEach(row => {
            const start = row.querySelector('.start-t').value;
            const end = row.querySelector('.end-t').value;
            const resCell = row.querySelector('.res-cell');
            if(start && end) {
                let s = start.split(':'), e = end.split(':');
                let startMin = parseInt(s[0])*60 + parseInt(s[1]);
                let endMin = parseInt(e[0])*60 + parseInt(e[1]);
                let diffRaw = endMin - startMin;

                if(diffRaw > 0) {
                    let roundedTotalMinutes = roundMinutes(diffRaw, currentRounding);
                    let decimalHours = roundedTotalMinutes / 60;
                    resCell.innerText = decimalHours.toFixed(2);
                    totalHours += decimalHours;
                } else resCell.innerText = "0.00";
            }
        });
        document.getElementById('total-hours').innerText = totalHours.toFixed(2);
        const wage = parseInt(document.getElementById('hourly-wage').value.replace(/\s/g, "")) || 0;
        document.getElementById('rounding-monthly-salary').innerText = Math.round(totalHours * wage).toLocaleString('hu-HU') + " Ft";
    }

    // --- JELENLÉT NÉZET ---
    function showPresenceView() {
        backToMenu();
        document.getElementById('presence-screen').classList.remove('hidden');
        renderPresenceCalendar();
    }

    function changeYear(n) { d.setFullYear(d.getFullYear() + n); renderPresenceCalendar(); }
    function changeMonth(n) { d.setMonth(d.getMonth() + n); if(!document.getElementById('presence-screen').classList.contains('hidden')) renderPresenceCalendar(); else renderRoundingTable(); }

    function renderPresenceCalendar() {
        document.getElementById('pres-year-val').innerText = d.getFullYear();
        document.getElementById('pres-month-val').innerText = months[d.getMonth()];
        const body = document.getElementById('calendar-body');
        body.innerHTML = '<div class="grid-header"></div>' + daysArr.map(day => `<div class="grid-header">${day}</div>`).join('');
        let firstDay = new Date(d.getFullYear(), d.getMonth(), 1);
        let lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        let startShift = (firstDay.getDay() + 6) % 7;
        let dateCounter = 1;

        for (let row = 0; row < 6; row++) {
            if (dateCounter > lastDay.getDate()) break;
            body.innerHTML += `<div class="week-num">${getWeekNumber(new Date(d.getFullYear(), d.getMonth(), dateCounter))}</div>`;
            for (let col = 0; col < 7; col++) {
                if ((row === 0 && col < startShift) || dateCounter > lastDay.getDate()) body.innerHTML += `<div></div>`;
                else {
                    body.innerHTML += `<div class="day-cell">${dateCounter}<input type="checkbox" onchange="calculatePresenceSalary()"></div>`;
                    dateCounter++;
                }
            }
        }
        calculatePresenceSalary();
    }

    function calculatePresenceSalary() {
        const checks = document.querySelectorAll('#calendar-body input[type="checkbox"]:checked').length;
        const wage = parseInt(document.getElementById('daily-wage').value.replace(/\s/g, "")) || 0;
        document.getElementById('day-count').innerText = checks;
        document.getElementById('pres-monthly-salary').innerText = (checks * wage).toLocaleString('hu-HU') + " Ft";
    }
</script>
</body>
</html>
