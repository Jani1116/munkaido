<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munkaidő PRO - Sync & Admin</title>
    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
            --danger: #ff453a; --success: #30d158; --admin: #5856d6;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); -webkit-tap-highlight-color: transparent; }
        .container { max-width: 500px; margin: auto; background: #121212; padding: 20px; border-radius: 28px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.8); text-align: center; }
        
        /* Samsung Tab S7 FE - Nagyobb képernyő optimalizálás */
        @media (min-width: 700px) {
            .container { max-width: 650px; padding: 40px; }
            .calendar-grid { gap: 10px; }
            .day-cell { min-height: 90px; font-size: 18px; }
        }

        #login-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        input { width: 100%; background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
        input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        
        .main-btn { display: flex; align-items: center; justify-content: center; background: var(--card); color: white; padding: 18px; margin: 12px auto; border: 1px solid var(--border); border-radius: 16px; font-size: 16px; width: 100%; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .main-btn:active { transform: scale(0.97); background: #2c2c2e; }
        .accent-btn { background: var(--accent); border: none; }
        .admin-btn { background: var(--admin); border: none; display: none; }

        .nav-row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; background: var(--card); padding: 10px 15px; border-radius: 14px; border: 1px solid var(--border); }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; padding: 5px 10px; }

        .calendar-grid { display: grid; grid-template-columns: 40px repeat(7, 1fr); gap: 6px; margin: 15px 0; }
        .grid-header { font-size: 11px; font-weight: bold; color: var(--accent); text-align: center; }
        .week-num { font-size: 10px; color: var(--secondary); align-self: center; text-align: center; }
        
        .day-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--card); min-height: 65px; border-radius: 12px; font-size: 14px; border: 1px solid var(--border); }
        .day-val { font-size: 10px; font-weight: bold; color: var(--success); margin-top: 4px; }

        .summary-section { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; }
        .sum-full { grid-column: span 2; border-top: 1px solid var(--border); padding-top: 10px; }
        .salary-input { background: #000; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; width: 100%; font-size: 16px; box-sizing: border-box; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 24px; width: 85%; max-width: 320px; border: 1px solid var(--border); }
        
        #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: none; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="loading-overlay">Szinkronizálás...</div>

<div id="login-screen">
    <h2 style="margin-bottom:20px">Munkaidő Belépés</h2>
    <div style="width:100%; max-width:300px">
        <input type="text" id="login-user" placeholder="Felhasználónév">
        <input type="password" id="login-pass" placeholder="Jelszó">
        <button class="main-btn accent-btn" onclick="handleLogin()">BELÉPÉS</button>
    </div>
</div>

<div id="page-main" class="container hidden">
    <div id="user-info" style="font-size:12px; color:var(--secondary); margin-bottom:10px"></div>
    <h1 style="margin-bottom:25px">Munkaidő</h1>
    <button class="main-btn" onclick="openPage('round15')">⏱️ 15p Kerekítés</button>
    <button class="main-btn" onclick="openPage('round30')">⏳ 30p Kerekítés</button>
    <button class="main-btn" onclick="openPage('presence')">📅 Jelenlét (✓)</button>
    <button id="admin-panel-btn" class="main-btn admin-btn" onclick="openAdmin()">+ ÚJ FELHASZNÁLÓ</button>
    <button class="main-btn" style="background:none; color:var(--danger); border:none; margin-top:20px" onclick="logout()">Kijelentkezés</button>
</div>

<div id="page-view" class="container hidden">
    <h2 id="view-title" style="margin:0 0 15px 0"></h2>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span id="month-display" style="font-weight:bold"></span>
        <button class="nav-btn" onclick="exportToExcel()" title="Mentés Excelbe">💾</button>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>
    <div class="calendar-grid" id="calendar-body"></div>
    
    <div class="summary-section">
        <div class="sum-box">
            <span id="label-wage" style="font-size:10px; color:var(--secondary)">ÓRABÉR</span>
            <input type="text" id="wage-input" class="salary-input" placeholder="0 Ft" oninput="formatCurrency(this); saveWages();">
        </div>
        <div class="sum-box">
            <span id="label-total" style="font-size:10px; color:var(--secondary)">ÓRÁK</span>
            <div id="total-count" style="font-size: 20px; font-weight: bold; margin-top:5px">0</div>
        </div>
        <div class="sum-box sum-full">
            <span style="font-size:10px; color:var(--secondary)">VÁRHATÓ FIZETÉS</span>
            <div id="total-money" style="font-size: 24px; font-weight: bold; color: var(--success);">0 Ft</div>
        </div>
    </div>
    <button class="main-btn" style="margin-top:20px" onclick="backToMenu()">Vissza a menübe</button>
</div>

<div id="admin-modal" class="modal">
    <div class="modal-content">
        <h3>Új felhasználó</h3>
        <input type="text" id="new-user-name" placeholder="Név">
        <input type="text" id="new-user-pass" placeholder="Jelszó">
        <button class="main-btn accent-btn" onclick="addUser()">LÉTREHOZÁS</button>
        <button class="main-btn" style="background:none; border:none" onclick="closeModal('admin-modal')">Mégse</button>
    </div>
</div>

<div id="time-modal" class="modal">
    <div class="modal-content">
        <h3 id="modal-date"></h3>
        <input type="text" id="start-time" inputmode="numeric" placeholder="Érkezés (08:00)" maxlength="5" onkeyup="timeMask(this)">
        <input type="text" id="end-time" inputmode="numeric" placeholder="Távozás (16:30)" maxlength="5" onkeyup="timeMask(this)">
        <div style="display:flex; justify-content:space-between; align-items:center; margin:15px 0">
            <span>Ebédidő (-30p)</span>
            <input type="checkbox" id="break-toggle" style="width:25px; height:25px">
        </div>
        <button class="main-btn accent-btn" onclick="saveTime()">MENTÉS</button>
        <button class="main-btn" style="background:none; border:none; color:var(--danger)" onclick="deleteEntry()">Törlés</button>
        <button class="main-btn" style="background:none; border:none" onclick="closeModal('time-modal')">Mégse</button>
    </div>
</div>

<script>
    const DB_URL = "https://kiadaskoveto-2e474-default-rtdb.firebaseio.com/";
    let currentUser = JSON.parse(localStorage.getItem('work_session'));
    let workData = {};
    let wages = { 'presence': '0', 'round15': '0', 'round30': '0' };
    let d = new Date();
    let mode = 'presence', selectedDay = null;
    const months = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];

    window.addEventListener('popstate', () => { 
        if (!document.getElementById('page-main').classList.contains('hidden')) return; 
        backToMenu(true); 
    });

    async function handleLogin() {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value.trim();
        if(!u || !p) return;
        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}users_auth/${u}.json`);
            let storedPass = await res.json();
            if(storedPass && String(storedPass).replace(/"/g, '') === String(p)) {
                currentUser = { name: u, isAdmin: (u.toLowerCase() === 'jani') };
                localStorage.setItem('work_session', JSON.stringify(currentUser));
                initApp();
            } else { alert("Hibás adatok!"); }
        } catch(e) { alert("Hálózati hiba!"); }
        showLoading(false);
    }

    async function initApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('page-main').classList.remove('hidden');
        document.getElementById('user-info').innerText = `FELHASZNÁLÓ: ${currentUser.name.toUpperCase()}`;
        if(currentUser.isAdmin) document.getElementById('admin-panel-btn').style.display = 'flex';
        await loadRemoteData();
    }

    async function loadRemoteData() {
        showLoading(true);
        const res = await fetch(`${DB_URL}work_data/${currentUser.name}.json`);
        const data = await res.json();
        if(data) { workData = data.entries || {}; wages = data.wages || wages; }
        showLoading(false); render();
    }

    async function syncData() {
        if(!currentUser) return;
        await fetch(`${DB_URL}work_data/${currentUser.name}.json`, { method: 'PUT', body: JSON.stringify({ entries: workData, wages: wages }) });
    }

    function openPage(m) {
        mode = m;
        history.pushState({page: 'view'}, '');
        document.getElementById('page-main').classList.add('hidden');
        document.getElementById('page-view').classList.remove('hidden');
        document.getElementById('label-total').innerText = mode === 'presence' ? "NAPOK" : "ÓRÁK";
        document.getElementById('label-wage').innerText = mode === 'presence' ? "NAPI FIZETÉS" : "ÓRABÉR";
        document.getElementById('view-title').innerText = mode === 'presence' ? "Jelenléti ív" : "Munkaidő napló";
        const val = wages[mode] || "0";
        const input = document.getElementById('wage-input');
        input.value = val === "0" ? "" : parseInt(val).toLocaleString('hu-HU') + " Ft";
        render();
    }

    function formatCurrency(i) { 
        let v = i.value.replace(/\D/g, ""); 
        if(!v) { i.value = ""; return; }
        i.value = parseInt(v).toLocaleString('hu-HU') + " Ft";
        let pos = i.value.length - 3;
        i.setSelectionRange(pos, pos);
    }

    async function saveWages() { 
        let v = document.getElementById('wage-input').value.replace(/\D/g, "");
        wages[mode] = v || "0"; 
        await syncData(); 
        calculateTotal(); 
    }

    async function saveTime() {
        let s = document.getElementById('start-time').value, e = document.getElementById('end-time').value;
        let hasBreak = document.getElementById('break-toggle').checked;
        if (s.includes(':') && e.includes(':')) {
            let sP = s.split(':'), eP = e.split(':');
            let m = (parseInt(eP[0])*60 + parseInt(eP[1])) - (parseInt(sP[0])*60 + parseInt(sP[1]));
            if (hasBreak) m -= 30;
            if (m > 0) {
                let step = mode === 'round15' ? 15 : 30;
                let hrs = Math.floor(m / 60), mins = m % 60;
                if(step === 15) {
                    if(mins >= 53) { hrs++; mins=0; } else if(mins >= 38) mins=45; else if(mins >= 23) mins=30; else if(mins >= 8) mins=15; else mins=0;
                } else {
                    if(mins >= 46) { hrs++; mins=0; } else if(mins >= 16) mins=30; else mins=0;
                }
                workData[`${mode}_${d.getFullYear()}_${d.getMonth()}_${selectedDay}`] = { start: s, end: e, total: ((hrs * 60 + mins) / 60).toFixed(2), hasBreak: hasBreak };
            }
        }
        await syncData(); closeModal('time-modal'); render();
    }

    function render() {
        document.getElementById('month-display').innerText = `${d.getFullYear()}. ${months[d.getMonth()]}`;
        const body = document.getElementById('calendar-body');
        body.innerHTML = '<div class="grid-header"></div>' + ["H", "K", "Sze", "Cs", "P", "Szo", "V"].map(h => `<div class="grid-header">${h}</div>`).join('');
        let firstDay = new Date(d.getFullYear(), d.getMonth(), 1);
        let lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        let startShift = (firstDay.getDay() + 6) % 7;
        let dateCounter = 1;
        for (let row = 0; row < 6; row++) {
            if (dateCounter > lastDay.getDate()) break;
            body.innerHTML += `<div class="week-num">${getWeekNum(new Date(d.getFullYear(), d.getMonth(), dateCounter))}</div>`;
            for (let col = 0; col < 7; col++) {
                if ((row === 0 && col < startShift) || dateCounter > lastDay.getDate()) body.innerHTML += `<div></div>`;
                else {
                    let key = `${mode}_${d.getFullYear()}_${d.getMonth()}_${dateCounter}`;
                    let val = workData[key] ? (mode==='presence' ? "✓" : workData[key].total+"ó") : "";
                    body.innerHTML += `<div class="day-cell" onclick="dayClick(${dateCounter})">${dateCounter}<div class="day-val">${val}</div></div>`;
                    dateCounter++;
                }
            }
        }
        calculateTotal();
    }

    function calculateTotal() {
        let total = 0, prefix = `${mode}_${d.getFullYear()}_${d.getMonth()}_`;
        for(let k in workData) if(k.startsWith(prefix) && workData[k]) total += (mode==='presence' ? 1 : parseFloat(workData[k].total));
        document.getElementById('total-count').innerText = mode==='presence' ? total : total.toFixed(2);
        let w = parseInt(document.getElementById('wage-input').value.replace(/\D/g, "")) || 0;
        document.getElementById('total-money').innerText = Math.round(total * w).toLocaleString('hu-HU') + " Ft";
    }

    function dayClick(day) { 
        selectedDay = day; 
        if(mode==='presence') { 
            let key=`${mode}_${d.getFullYear()}_${d.getMonth()}_${day}`; 
            workData[key]=workData[key]?null:1; syncData().then(render); 
        } else { 
            let entry = workData[`${mode}_${d.getFullYear()}_${d.getMonth()}_${day}`] || {};
            document.getElementById('modal-date').innerText = `${months[d.getMonth()]} ${day}.`;
            document.getElementById('start-time').value = entry.start || "";
            document.getElementById('end-time').value = entry.end || "";
            document.getElementById('break-toggle').checked = entry.hasBreak || false;
            document.getElementById('time-modal').style.display='flex'; 
        } 
    }

    function exportToExcel() {
        const year = d.getFullYear();
        const month = d.getMonth();
        const monthName = months[month];
        let csvContent = "\uFEFFDátum;Érkezés;Távozás;Ebéd;Óra/Jelenlét\n";
        let lastDay = new Date(year, month + 1, 0).getDate();
        let totalValue = 0;

        for (let day = 1; day <= lastDay; day++) {
            let key = `${mode}_${year}_${month}_${day}`;
            let entry = workData[key];
            let rowDate = `${year}.${month + 1}.${day}.`;
            if (entry) {
                if (mode === 'presence') { csvContent += `${rowDate};-;-;-;Jelen (1)\n`; totalValue += 1; } 
                else {
                    let breakText = entry.hasBreak ? "30p" : "0";
                    csvContent += `${rowDate};${entry.start};${entry.end};${breakText};${entry.total} óra\n`;
                    totalValue += parseFloat(entry.total);
                }
            } else { csvContent += `${rowDate};-;-;-;-\n`; }
        }
        let wage = parseInt(wages[mode]) || 0;
        let label = mode === 'presence' ? "Összes nap" : "Összes óra";
        csvContent += `\n${label};;;;${totalValue}\nEgységnyi bér;;;;${wage} Ft\nVárható fizetés;;;;${Math.round(totalValue * wage)} Ft\n`;
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.body.appendChild(document.createElement("a"));
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute("download", `Munkaido_${currentUser.name}_${year}_${monthName}.csv`);
        link.click();
        document.body.removeChild(link);
    }

    async function deleteEntry() { delete workData[`${mode}_${d.getFullYear()}_${d.getMonth()}_${selectedDay}`]; await syncData(); closeModal('time-modal'); render(); }
    async function addUser() {
        const name = document.getElementById('new-user-name').value.trim();
        const pass = document.getElementById('new-user-pass').value.trim();
        if(!name || !pass) return;
        showLoading(true);
        await fetch(`${DB_URL}users_auth/${name}.json`, { method: 'PUT', body: JSON.stringify(pass) });
        alert(name + " létrehozva!"); closeModal('admin-modal'); showLoading(false);
    }
    function openAdmin() { document.getElementById('admin-modal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function backToMenu(pop = false) { document.getElementById('page-view').classList.add('hidden'); document.getElementById('page-main').classList.remove('hidden'); if(!pop) history.back(); }
    function logout() { localStorage.removeItem('work_session'); location.reload(); }
    function showLoading(s) { document.getElementById('loading-overlay').style.display = s ? 'flex' : 'none'; }
    function timeMask(i) { let v = i.value.replace(/\D/g, ""); if (v.length >= 3) i.value = v.substring(0, 2) + ":" + v.substring(2, 4); else i.value = v; }
    function changeMonth(n) { d.setMonth(d.getMonth() + n); render(); }
    function getWeekNum(date) { let t = new Date(date.valueOf()); t.setDate(t.getDate() - ((date.getDay() + 6) % 7) + 3); let f = t.valueOf(); t.setMonth(0, 1); if (t.getDay() !== 4) t.setMonth(0, 1 + ((4 - t.getDay()) + 7) % 7); return 1 + Math.ceil((f - t) / 604800000); }
    if(currentUser) initApp();
</script>
</body>
</html>
