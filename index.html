<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munkaidő Pro - Automata Mentés</title>
    <style>
        /* A stílus marad a korábbi, kedvelt sötét design */
        :root {
            --bg: #000000; --card: #121212; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
            --danger: #ff453a; --warning: #ff9f0a; --success: #30d158;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); }
        .container { max-width: 500px; margin: auto; background: var(--card); padding: 20px; border-radius: 28px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.8); text-align: center; }
        .main-btn { display: flex; align-items: center; justify-content: center; background: #1c1c1e; color: white; padding: 20px; margin: 12px auto; border: 1px solid var(--border); border-radius: 18px; font-size: 16px; width: 100%; cursor: pointer; transition: 0.2s; }
        .export-btn { background: #262626; color: var(--success); border-color: #30d15844; margin-top: 20px; }
        .nav-row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; background: #1c1c1e; padding: 10px 15px; border-radius: 14px; border: 1px solid var(--border); }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; padding: 5px 15px; }
        .calendar-grid { display: grid; grid-template-columns: 40px repeat(7, 1fr); gap: 6px; margin: 15px 0; width: 100%; }
        .grid-header { font-size: 11px; font-weight: bold; color: var(--accent); text-align: center; padding-bottom: 5px; }
        .week-num { font-size: 10px; color: var(--secondary); align-self: center; text-align: center; }
        .day-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1c1c1e; min-height: 65px; border-radius: 12px; font-size: 14px; border: 1px solid #2c2c2e; cursor: pointer; }
        .day-val { font-size: 12px; font-weight: bold; color: var(--success); margin-top: 4px; }
        .partial-val { color: var(--warning); }
        .summary-section { background: #1c1c1e; padding: 15px; border-radius: 20px; border: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-top: 10px; }
        .sum-full { grid-column: span 2; border-top: 1px solid #2c2c2e; padding-top: 10px; }
        .salary-input { background: #000; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; width: 100%; font-size: 16px; box-sizing: border-box; }
        #time-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #1c1c1e; padding: 25px; border-radius: 24px; border: 1px solid var(--border); width: 85%; max-width: 320px; }
        .modal-content input { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid var(--border); color: white; border-radius: 12px; font-size: 24px; text-align: center; box-sizing: border-box; }
        .switch-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; padding: 10px; background: #000; border-radius: 12px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(24px); }
        .modal-btn { background: var(--accent); color: white; border: none; padding: 16px; width: 100%; border-radius: 14px; margin-top: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .delete-btn { color: var(--danger); background: none; border: none; width: 100%; margin-top: 10px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="page-main" class="container">
    <h1 style="margin-bottom:30px">Munkaidő</h1>
    <button class="main-btn" onclick="openPage('round15')">⏱️ 15p Kerekítéssel</button>
    <button class="main-btn" onclick="openPage('round30')">⏳ 30p Kerekítéssel</button>
    <button class="main-btn" onclick="openPage('presence')">📅 Jelenlét (✓)</button>
    <button class="main-btn export-btn" onclick="exportToCSV()">💾 Biztonsági mentés (.csv fájl)</button>
</div>

<div id="page-view" class="container hidden">
    <h2 id="view-title" style="margin:0 0 15px 0"></h2>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span id="month-display" style="font-weight:bold"></span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>
    <div class="calendar-grid" id="calendar-body"></div>
    <div class="summary-section">
        <div class="sum-box">
            <span style="font-size:10px; color:var(--secondary)">ÓRABÉR</span>
            <input type="text" class="salary-input" id="wage-input" oninput="formatCurrency(this); saveAll();">
        </div>
        <div class="sum-box">
            <span style="font-size:10px; color:var(--secondary)">ÖSSZES ÓRA</span>
            <div id="total-count" style="font-size: 22px; font-weight: bold; margin-top:8px">0</div>
        </div>
        <div class="sum-box sum-full">
            <span style="font-size:10px; color:var(--secondary)">VÁRHATÓ FIZETÉS</span>
            <div id="total-money" style="font-size: 26px; font-weight: bold; color: var(--success);">0 Ft</div>
        </div>
    </div>
    <button class="main-btn" style="margin-top:20px" onclick="backToMenu()">Főmenü</button>
</div>

<div id="time-modal">
    <div class="modal-content">
        <h3 id="modal-date" style="text-align:center; margin:0 0 20px 0"></h3>
        <label style="color:var(--secondary); font-size:12px">ÉRKEZÉS</label>
        <input type="text" id="start-time" inputmode="numeric" placeholder="08:00" maxlength="5" onkeyup="timeMask(this)">
        <label style="color:var(--secondary); font-size:12px">TÁVOZÁS</label>
        <input type="text" id="end-time" inputmode="numeric" placeholder="16:30" maxlength="5" onkeyup="timeMask(this)">
        <div class="switch-row"><span style="font-size:14px">Ebédidő (-30p)</span><label class="switch"><input type="checkbox" id="break-toggle"><span class="slider"></span></label></div>
        <button class="modal-btn" onclick="saveTime()">MENTÉS</button>
        <button class="delete-btn" onclick="deleteEntry()">Törlés</button>
        <button class="main-btn" style="border:none; background:none; font-size:14px" onclick="closeModal()">Mégse</button>
    </div>
</div>

<script>
    let d = new Date();
    let mode = 'presence';
    let selectedDay = null;
    const months = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];

    // Adatok betöltése
    let workData = JSON.parse(localStorage.getItem('workData')) || {};
    let wages = JSON.parse(localStorage.getItem('wages')) || { 'presence': '0', 'round15': '0', 'round30': '0' };

    function saveAll() {
        wages[mode] = document.getElementById('wage-input').value;
        localStorage.setItem('workData', JSON.stringify(workData));
        localStorage.setItem('wages', JSON.stringify(wages));
        calculateTotal();
    }

    function timeMask(input) {
        let val = input.value.replace(/\D/g, "");
        if (val.length > 2) input.value = val.substring(0, 2) + ":" + val.substring(2, 4);
        else input.value = val;
    }

    function openPage(m) {
        mode = m;
        document.getElementById('page-main').classList.add('hidden');
        document.getElementById('page-view').classList.remove('hidden');
        document.getElementById('view-title').innerText = mode==='presence' ? "Jelenléti ív" : "Munkaidő";
        document.getElementById('wage-input').value = wages[mode] || 0;
        render();
    }

    function backToMenu() {
        document.getElementById('page-view').classList.add('hidden');
        document.getElementById('page-main').classList.remove('hidden');
    }

    function render() {
        document.getElementById('month-display').innerText = `${d.getFullYear()}. ${months[d.getMonth()]}`;
        const body = document.getElementById('calendar-body');
        body.innerHTML = '<div class="grid-header"></div>' + ["H", "K", "Sze", "Cs", "P", "Szo", "V"].map(h => `<div class="grid-header">${h}</div>`).join('');
        let firstDay = new Date(d.getFullYear(), d.getMonth(), 1);
        let lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        let startShift = (firstDay.getDay() + 6) % 7;
        let dateCounter = 1;

        for (let row = 0; row < 6; row++) {
            if (dateCounter > lastDay.getDate()) break;
            body.innerHTML += `<div class="week-num">${getWeekNum(new Date(d.getFullYear(), d.getMonth(), dateCounter))}</div>`;
            for (let col = 0; col < 7; col++) {
                if ((row === 0 && col < startShift) || dateCounter > lastDay.getDate()) {
                    body.innerHTML += `<div></div>`;
                } else {
                    let key = `${mode}-${d.getFullYear()}-${d.getMonth()}-${dateCounter}`;
                    let entry = workData[key];
                    let display = "";
                    if(mode === 'presence') display = entry === 1 ? "✓" : "";
                    else if (entry) {
                        if (entry.total > 0) display = entry.total + "ó" + (entry.hasBreak ? '☕' : "");
                        else if (entry.start) display = '<span class="partial-val">...</span>';
                    }
                    body.innerHTML += `<div class="day-cell" onclick="dayClick(${dateCounter})">${dateCounter}<div class="day-val">${display}</div></div>`;
                    dateCounter++;
                }
            }
        }
        calculateTotal();
    }

    function dayClick(day) {
        selectedDay = day;
        let key = `${mode}-${d.getFullYear()}-${d.getMonth()}-${day}`;
        if(mode === 'presence') {
            workData[key] = workData[key] === 1 ? "" : 1;
            saveAll(); render();
        } else {
            let entry = workData[key] || {};
            document.getElementById('modal-date').innerText = `${months[d.getMonth()]} ${day}.`;
            document.getElementById('start-time').value = entry.start || "";
            document.getElementById('end-time').value = entry.end || "";
            document.getElementById('break-toggle').checked = entry.hasBreak || false;
            document.getElementById('time-modal').style.display = 'flex';
        }
    }

    function saveTime() {
        let s = document.getElementById('start-time').value, e = document.getElementById('end-time').value;
        let hasBreak = document.getElementById('break-toggle').checked;
        let key = `${mode}-${d.getFullYear()}-${d.getMonth()}-${selectedDay}`;

        if (!s && !e) delete workData[key];
        else {
            let entry = { start: s, end: e, total: 0, hasBreak: hasBreak };
            if (s.includes(':') && e.includes(':')) {
                let sP = s.split(':'), eP = e.split(':');
                let m = (parseInt(eP[0])*60 + parseInt(eP[1])) - (parseInt(sP[0])*60 + parseInt(sP[1]));
                if (hasBreak) m -= 30;
                if (m > 0) {
                    let step = mode === 'round15' ? 15 : 30;
                    let hrs = Math.floor(m / 60), mins = m % 60;
                    if(step === 15) {
                        if(mins >= 53) { hrs++; mins=0; } else if(mins >= 38) mins=45; else if(mins >= 23) mins=30; else if(mins >= 8) mins=15; else mins=0;
                    } else {
                        if(mins >= 46) { hrs++; mins=0; } else if(mins >= 16) mins=30; else mins=0;
                    }
                    entry.total = ((hrs * 60 + mins) / 60).toFixed(2);
                }
            }
            workData[key] = entry;
        }
        saveAll(); closeModal(); render();
    }

    function deleteEntry() {
        delete workData[`${mode}-${d.getFullYear()}-${d.getMonth()}-${selectedDay}`];
        saveAll(); closeModal(); render();
    }

    function calculateTotal() {
        let total = 0, prefix = `${mode}-${d.getFullYear()}-${d.getMonth()}-`;
        for(let k in workData) { 
            if(k.startsWith(prefix)) {
                let entry = workData[k];
                total += (mode === 'presence' ? (entry === 1 ? 1 : 0) : parseFloat(entry.total || 0));
            }
        }
        document.getElementById('total-count').innerText = mode==='presence' ? total : total.toFixed(2);
        let w = parseInt(document.getElementById('wage-input').value.replace(/\s/g, "")) || 0;
        document.getElementById('total-money').innerText = Math.round(total * w).toLocaleString('hu-HU') + " Ft";
    }

    function exportToCSV() {
        let fileName = prompt("Mi legyen a mentés neve?", "munkaido_mentes");
        if (!fileName) return;
        let csv = "Datum;Mod;Erkezes;Tavozas;Ebedido;Osszes Ora\n";
        for (let key in workData) {
            let p = key.split('-');
            let entry = workData[key];
            if (p[0] === 'presence' && entry === 1) csv += `${p[1]}.${parseInt(p[2])+1}.${p[3]};Jelenlet;-;-;-;1\n`;
            else if (p[0] !== 'presence') csv += `${p[1]}.${parseInt(p[2])+1}.${p[3]};${p[0]};${entry.start || '-'};${entry.end || '-'};${entry.hasBreak ? 'Igen' : 'Nem'};${entry.total || 0}\n`;
        }
        let blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
        let url = URL.createObjectURL(blob);
        let link = document.createElement("a");
        link.href = url;
        link.download = fileName + ".csv";
        link.click();
    }

    function closeModal() { document.getElementById('time-modal').style.display = 'none'; }
    function formatCurrency(i) { i.value = i.value.replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
    function changeMonth(n) { d.setMonth(d.getMonth() + n); render(); }
    function getWeekNum(date) {
        let t = new Date(date.valueOf()); t.setDate(t.getDate() - ((date.getDay() + 6) % 7) + 3);
        let f = t.valueOf(); t.setMonth(0, 1);
        if (t.getDay() !== 4) t.setMonth(0, 1 + ((4 - t.getDay()) + 7) % 7);
        return 1 + Math.ceil((f - t) / 604800000);
    }
</script>
</body>
</html>
