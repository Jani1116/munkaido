<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munkaidő & Bevétel PRO</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
            --danger: #ff453a; --success: #30d158; --extra: #bf5af2;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); -webkit-tap-highlight-color: transparent; }
        .container { max-width: 500px; margin: auto; background: #121212; padding: 20px; border-radius: 28px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.8); text-align: center; min-height: 90vh; box-sizing: border-box; }
        input, select { width: 100%; background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
        .main-btn { display: flex; align-items: center; justify-content: center; background: var(--card); color: white; padding: 16px 10px; margin: 12px auto; border: 1px solid var(--border); border-radius: 16px; font-size: 15px; width: 100%; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .accent-btn { background: var(--accent); border: none; }
        .extra-btn { background: var(--extra); border: none; }
        .btn-row { display: flex; gap: 8px; margin-top: 15px; }
        .btn-row .main-btn { margin: 0; flex: 1; font-size: 14px; padding: 14px 6px; }
        .nav-row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; background: var(--card); padding: 10px 15px; border-radius: 14px; border: 1px solid var(--border); }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: 40px repeat(7, 1fr); gap: 6px; margin: 15px 0; }
        .grid-header { font-size: 11px; font-weight: bold; color: var(--accent); text-align: center; }
        .week-num { font-size: 10px; color: var(--secondary); align-self: center; text-align: center; }
        .day-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--card); min-height: 65px; border-radius: 12px; font-size: 14px; border: 1px solid var(--border); cursor: pointer; }
        .day-val { font-size: 9px; font-weight: bold; color: var(--success); margin-top: 4px; text-align: center; word-break: break-all; }
        .day-val.extra { color: var(--extra); }
        .summary-section { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; }
        .sum-full { grid-column: span 2; border-top: 1px solid var(--border); padding-top: 10px; }
        .salary-input { background: #000; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; width: 100%; font-size: 16px; box-sizing: border-box; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 24px; width: 88%; max-width: 360px; border: 1px solid var(--border); max-height: 85vh; overflow-y: auto; }
        #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: none; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .hidden { display: none !important; }
        .annual-table { width: 100%; border-collapse: collapse; margin-top: 15px; color: #fff; }
        .annual-table th, .annual-table td { padding: 6px 4px; border-bottom: 1px solid #333; text-align: center; font-size: 12px; }
        .annual-table th { color: var(--secondary); font-size: 10px; }
        .allowance-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .allowance-row input { margin-bottom: 0; }
        .del-allowance { background: var(--danger); border: none; color: white; border-radius: 8px; width: 45px; height: 45px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; text-align: left; }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: var(--secondary); }
        .stat-val { font-weight: bold; color: #fff; }

        /* NYOMTATÁSI NÉZET */
        #print-area { display: none; }
        @media print {
            body { background: #fff !important; color: #000 !important; padding: 0 !important; }
            .container, .modal, #loading-overlay { display: none !important; }
            #print-area { display: block !important; width: 100%; font-family: Arial, sans-serif; color: #000; }
            #print-area h2 { margin: 0 0 5px 0; font-size: 18px; }
            #print-area p { margin: 0 0 15px 0; font-size: 12px; color: #444; }
            .print-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 12px; }
            .print-table th, .print-table td { border: 1px solid #999; padding: 6px 8px; text-align: center; }
            .print-table th { background: #f0f0f0 !important; -webkit-print-color-adjust: exact; font-weight: bold; }
            .print-summary { border: 1px solid #999; padding: 10px; background: #fafafa !important; -webkit-print-color-adjust: exact; font-size: 13px; }
            .print-summary div { display: flex; justify-content: space-between; margin-bottom: 4px; }
        }
    </style>
</head>
<body>

<div id="loading-overlay">Szinkronizálás...</div>

<!-- NYOMTATÁSI TERÜLET -->
<div id="print-area"></div>

<!-- FŐMENÜ -->
<div id="page-main" class="container">
    <div id="user-info" style="font-size:12px; color:var(--secondary); margin-bottom:10px">FIÓK: JANI</div>
    <h1 style="margin-bottom:25px">Főmenü</h1>
    <button class="main-btn" onclick="openPage('round15')">⏱️ 15p Kerekítés</button>
    <button class="main-btn" onclick="openPage('presence')">📅 Jelenlét (✓)</button>
    <button class="main-btn extra-btn" onclick="openPage('extra')">💰 Extra bevétel</button>
    <button class="main-btn" onclick="openAnnualPage()">📊 Éves összesítő</button>
</div>

<!-- NAPTÁR / MUNKANÉZET -->
<div id="page-view" class="container hidden">
    <h2 id="view-title" style="margin:0 0 15px 0"></h2>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span id="month-display" style="font-weight:bold"></span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>
    <div class="calendar-grid" id="calendar-body"></div>
    
    <div class="summary-section">
        <div class="sum-box" id="wage-box">
            <span id="label-wage" style="font-size:10px; color:var(--secondary)">ÓRABÉR</span>
            <input type="text" id="wage-input" class="salary-input" placeholder="0 Ft" oninput="formatCurrency(this); saveWages();">
        </div>
        <div class="sum-box">
            <span id="label-total" style="font-size:10px; color:var(--secondary)">ÓRÁK</span>
            <div id="total-count" style="font-size: 20px; font-weight: bold; margin-top:5px">0</div>
        </div>
        
        <!-- EGYÉB BEVÉTELEK SZEKCIÓ -->
        <div class="sum-full" style="border-top:1px solid var(--border); padding-top:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="font-size:10px; color:var(--extra); font-weight:bold;">EGYÉB BEVÉTELEK (Pl. Bérlet)</span>
                <button onclick="addAllowanceField()" style="background:var(--extra); border:none; color:white; border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; font-weight:bold;">+ Új</button>
            </div>
            <div id="allowances-container"></div>
        </div>

        <div class="sum-box sum-full">
            <span id="label-result" style="font-size:10px; color:var(--secondary)">VÁRHATÓ FIZETÉS (ÖSSZESEN)</span>
            <div id="total-money" style="font-size: 24px; font-weight: bold; color: var(--success);">0 Ft</div>
        </div>
    </div>
    
    <div class="btn-row">
        <button class="main-btn" onclick="goBack()">⬅️ Vissza</button>
        <button class="main-btn" onclick="printCurrentView()">🖨️ Nyomtatás</button>
        <button class="main-btn" onclick="openMonthSummaryModal()">📊 Összesítés</button>
    </div>
</div>

<!-- ÉVES ÖSSZESÍTŐ -->
<div id="page-annual" class="container hidden">
    <h2>Éves Összesítő</h2>
    <select id="year-select" onchange="renderAnnual()"></select>
    <div id="annual-data" style="margin-top:15px;"></div>
    <div class="btn-row">
        <button class="main-btn" onclick="goBack()">⬅️ Vissza</button>
        <button class="main-btn" onclick="printAnnualView()">🖨️ Nyomtatás</button>
    </div>
</div>

<!-- HAVI RÉSZLETES ÖSSZESÍTÉS MODAL -->
<div id="month-summary-modal" class="modal">
    <div class="modal-content">
        <h3 id="summary-modal-title" style="margin-top:0; color:var(--accent);"></h3>
        <div id="summary-modal-body"></div>
        <button class="main-btn accent-btn" style="margin-top:20px; margin-bottom:0;" onclick="goBack()">Bezárás</button>
    </div>
</div>

<!-- IDŐBEVITELI MODAL -->
<div id="time-modal" class="modal">
    <div class="modal-content">
        <h3 id="modal-date"></h3>
        <input type="text" id="start-time" inputmode="numeric" placeholder="Érkezés (18:30)" maxlength="5" onkeyup="timeMask(this)">
        <input type="text" id="end-time" inputmode="numeric" placeholder="Távozás (02:30)" maxlength="5" onkeyup="timeMask(this)">
        <div style="display:flex; justify-content:space-between; align-items:center; margin:15px 0">
            <span>Ebédidő (-30p)</span>
            <input type="checkbox" id="break-toggle" style="width:25px; height:25px">
        </div>
        <button class="main-btn accent-btn" onclick="saveTime()">MENTÉS</button>
        <button class="main-btn" style="background:none; border:none; color:var(--danger)" onclick="deleteEntry('time-modal')">Törlés</button>
        <button class="main-btn" style="background:none; border:none" onclick="goBack()">Mégse</button>
    </div>
</div>

<!-- EXTRA BEVÉTEL MODAL -->
<div id="extra-modal" class="modal">
    <div class="modal-content">
        <h3 id="extra-modal-date"></h3>
        <input type="text" id="extra-amount" inputmode="numeric" placeholder="Összeg (Ft)" oninput="formatCurrency(this)">
        <input type="text" id="extra-note" placeholder="Megjegyzés (pl. Fusi, Tippmix)">
        <button class="main-btn extra-btn" onclick="saveExtra()">MENTÉS</button>
        <button class="main-btn" style="background:none; border:none; color:var(--danger)" onclick="deleteEntry('extra-modal')">Törlés</button>
        <button class="main-btn" style="background:none; border:none" onclick="goBack()">Mégse</button>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) { 
        navigator.serviceWorker.register('./sw.js').then(reg => reg.update()); 
    }
    const DB_URL = "https://kiadaskoveto-2e474-default-rtdb.firebaseio.com/";
    const LOCAL_CACHE_KEY = "work_data_cache_Jani";
    const currentUser = { name: "Jani" };
    let workData = {}, wages = {}, allowances = {}, d = new Date(), mode = 'presence', selectedDay = null;
    const months = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];
    const weekDaysFull = ["Vasárnap", "Hétfő", "Kedd", "Szerda", "Csütörtök", "Péntek", "Szombat"];

    /* --- KÉSZÜLÉK VISSZANYÍL (HISTORY API) KEZELÉS --- */
    let currentScreen = 'main';
    let activeModal = null;

    window.addEventListener('DOMContentLoaded', async () => {
        history.replaceState({ screen: 'main', modal: null }, '');
        await loadRemoteData();
    });

    window.addEventListener('popstate', (e) => {
        const state = e.state || { screen: 'main', modal: null };
        applyNavigationState(state.screen, state.modal);
    });

    function navigateTo(screen, modal = null) {
        currentScreen = screen;
        activeModal = modal;
        history.pushState({ screen, modal }, '');
        applyNavigationState(screen, modal);
    }

    function goBack() {
        if (history.state && (history.state.modal !== null || history.state.screen !== 'main')) {
            history.back();
        } else {
            applyNavigationState('main', null);
        }
    }

    function applyNavigationState(screen, modal) {
        currentScreen = screen;
        activeModal = modal;

        ['time-modal', 'extra-modal', 'month-summary-modal'].forEach(id => {
            document.getElementById(id).style.display = 'none';
        });

        document.getElementById('page-main').classList.toggle('hidden', screen !== 'main');
        document.getElementById('page-view').classList.toggle('hidden', screen !== 'view');
        document.getElementById('page-annual').classList.toggle('hidden', screen !== 'annual');

        if (modal) {
            document.getElementById(modal).style.display = 'flex';
        }
    }

    /* --- ADATBETÖLTÉS ÉS MENTÉS (OFFLINE GYORSÍTÓTÁRRAL) --- */
    function saveLocalCache() {
        try {
            localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ entries: workData, wages: wages, allowances: allowances }));
        } catch(e) {}
    }

    function loadLocalCache() {
        try {
            const cached = JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY));
            if (cached) {
                workData = cached.entries || {};
                wages = cached.wages || {};
                allowances = cached.allowances || {};
            }
        } catch(e) {}
    }

    async function loadRemoteData() {
        loadLocalCache();
        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}work_data/${currentUser.name}.json`);
            const data = await res.json();
            if(data) { 
                workData = data.entries || {}; 
                wages = data.wages || {}; 
                allowances = data.allowances || {};
                saveLocalCache();
            }
        } catch(e) { console.log("Offline mód: helyi gyorsítótár betöltve."); }
        showLoading(false); 
        render();
    }

    async function syncData() {
        saveLocalCache();
        try {
            await fetch(`${DB_URL}work_data/${currentUser.name}.json`, { 
                method: 'PUT', 
                body: JSON.stringify({ entries: workData, wages: wages, allowances: allowances }) 
            });
        } catch(e) { console.log("Offline mentés: szinkronizálás várakozik."); }
    }

    /* --- OLDALNYITÁSOK --- */
    function openPage(m) {
        mode = m;
        const titles = {
            'round15': '⏱️ 15p Kerekítés',
            'presence': '📅 Jelenlét (✓)',
            'extra': '💰 Extra bevétel'
        };
        document.getElementById('view-title').innerText = titles[m] || '';
        
        const wageBox = document.getElementById('wage-box');
        const labelWage = document.getElementById('label-wage');
        const labelTotal = document.getElementById('label-total');
        const labelResult = document.getElementById('label-result');

        if (m === 'extra') {
            wageBox.classList.add('hidden');
            labelTotal.innerText = 'TÉTELEK';
            labelResult.innerText = 'EXTRA + EGYÉB ÖSSZESEN';
        } else if (m === 'presence') {
            wageBox.classList.remove('hidden');
            labelWage.innerText = 'NAPIDÍJ';
            labelTotal.innerText = 'NAPOK';
            labelResult.innerText = 'VÁRHATÓ FIZETÉS (ÖSSZESEN)';
        } else {
            wageBox.classList.remove('hidden');
            labelWage.innerText = 'ÓRABÉR';
            labelTotal.innerText = 'ÓRÁK';
            labelResult.innerText = 'VÁRHATÓ FIZETÉS (ÖSSZESEN)';
        }

        updateWageInputField();
        renderAllowances();
        render();
        navigateTo('view', null);
    }

    function openAnnualPage() {
        let select = document.getElementById('year-select');
        const curYear = new Date().getFullYear();
        let opts = '';
        for (let y = 2025; y <= curYear + 2; y++) {
            opts += `<option value="${y}">${y}</option>`;
        }
        select.innerHTML = opts;
        select.value = curYear;
        renderAnnual();
        navigateTo('annual', null);
    }

    /* --- HAVI RÉSZLETES ÖSSZESÍTÉS MODAL --- */
    function openMonthSummaryModal() {
        const year = d.getFullYear();
        const monthIdx = d.getMonth();
        const prefix = `${mode}_${year}_${monthIdx}_`;
        const wageKey = `wage_${year}_${monthIdx}_${mode}`;
        const currentWage = parseInt(wages[wageKey]) || 0;
        const monthAllowances = allowances[getMonthAllowancesKey()] || [];
        const totalAllowances = monthAllowances.reduce((sum, item) => sum + (parseInt(item.amount) || 0), 0);

        const titleEl = document.getElementById('summary-modal-title');
        const bodyEl = document.getElementById('summary-modal-body');
        let html = '';

        if (mode === 'round15') {
            titleEl.innerText = `${year}. ${months[monthIdx]} – Munkaidő összegzés`;
            let daysWorked = 0, totalHours = 0, nightShifts = 0, breakCount = 0;

            for (let k in workData) {
                if (k.startsWith(prefix) && workData[k]) {
                    daysWorked++;
                    totalHours += parseFloat(workData[k].total || 0);
                    if (workData[k].isNight) nightShifts++;
                    if (workData[k].hasBreak) breakCount++;
                }
            }
            const basePay = Math.round(totalHours * currentWage);
            const avgHours = daysWorked > 0 ? (totalHours / daysWorked).toFixed(2) : '0.00';

            html = `
                <div class="stat-row"><span class="stat-label">Ledolgozott napok:</span><span class="stat-val">${daysWorked} nap</span></div>
                <div class="stat-row"><span class="stat-label">Összes munkaidő:</span><span class="stat-val">${totalHours.toFixed(2)} óra</span></div>
                <div class="stat-row"><span class="stat-label">Átlagos műszak:</span><span class="stat-val">${avgHours} óra / nap</span></div>
                <div class="stat-row"><span class="stat-label">Éjszakai műszakok (🌙):</span><span class="stat-val">${nightShifts} alkalom</span></div>
                <div class="stat-row"><span class="stat-label">Levont ebédidők (-30p):</span><span class="stat-val">${breakCount} alkalom (${(breakCount * 0.5).toFixed(1)} óra)</span></div>
                <div class="stat-row"><span class="stat-label">Órabér alapú fizetés:</span><span class="stat-val">${basePay.toLocaleString('hu-HU')} Ft</span></div>
                <div class="stat-row"><span class="stat-label">Egyéb bevételek:</span><span class="stat-val">${totalAllowances.toLocaleString('hu-HU')} Ft</span></div>
                <div class="stat-row" style="border-top:2px solid var(--border); margin-top:5px;">
                    <span class="stat-label" style="color:#fff; font-weight:bold;">MINDÖSSZESEN:</span>
                    <span class="stat-val" style="color:var(--success); font-size:17px;">${(basePay + totalAllowances).toLocaleString('hu-HU')} Ft</span>
                </div>
            `;
        } else if (mode === 'presence') {
            titleEl.innerText = `${year}. ${months[monthIdx]} – Jelenlét összegzés`;
            let weekdays = 0, weekends = 0;

            for (let k in workData) {
                if (k.startsWith(prefix) && workData[k]) {
                    const dayNum = parseInt(k.split('_')[3]);
                    const dow = new Date(year, monthIdx, dayNum).getDay();
                    if (dow === 0 || dow === 6) weekends++;
                    else weekdays++;
                }
            }
            const totalDays = weekdays + weekends;
            const basePay = totalDays * currentWage;

            html = `
                <div class="stat-row"><span class="stat-label">Összes jelenléti nap:</span><span class="stat-val">${totalDays} nap</span></div>
                <div class="stat-row"><span class="stat-label">Hétköznap (H–P):</span><span class="stat-val">${weekdays} nap</span></div>
                <div class="stat-row"><span class="stat-label">Hétvége (Szo–V):</span><span class="stat-val">${weekends} nap</span></div>
                <div class="stat-row"><span class="stat-label">Napidíjas fizetés:</span><span class="stat-val">${basePay.toLocaleString('hu-HU')} Ft</span></div>
                <div class="stat-row"><span class="stat-label">Egyéb bevételek:</span><span class="stat-val">${totalAllowances.toLocaleString('hu-HU')} Ft</span></div>
                <div class="stat-row" style="border-top:2px solid var(--border); margin-top:5px;">
                    <span class="stat-label" style="color:#fff; font-weight:bold;">MINDÖSSZESEN:</span>
                    <span class="stat-val" style="color:var(--success); font-size:17px;">${(basePay + totalAllowances).toLocaleString('hu-HU')} Ft</span>
                </div>
            `;
        } else if (mode === 'extra') {
            titleEl.innerText = `${year}. ${months[monthIdx]} – Extra bevételek`;
            let count = 0, extraSum = 0;
            let byCategory = {};

            for (let k in workData) {
                if (k.startsWith(prefix) && workData[k]) {
                    count++;
                    const amt = parseInt(workData[k].amount || 0);
                    extraSum += amt;
                    const cat = (workData[k].note && workData[k].note.trim() !== '') ? workData[k].note.trim() : 'Megjegyzés nélkül';
                    byCategory[cat] = (byCategory[cat] || 0) + amt;
                }
            }

            html += `<div class="stat-row"><span class="stat-label">Rögzített tételek száma:</span><span class="stat-val">${count} db</span></div>`;
            for (let cat in byCategory) {
                html += `<div class="stat-row"><span class="stat-label">• ${cat}:</span><span class="stat-val">${byCategory[cat].toLocaleString('hu-HU')} Ft</span></div>`;
            }
            html += `
                <div class="stat-row"><span class="stat-label">Extra tételek összesen:</span><span class="stat-val">${extraSum.toLocaleString('hu-HU')} Ft</span></div>
                <div class="stat-row"><span class="stat-label">Egyéb bevételek:</span><span class="stat-val">${totalAllowances.toLocaleString('hu-HU')} Ft</span></div>
                <div class="stat-row" style="border-top:2px solid var(--border); margin-top:5px;">
                    <span class="stat-label" style="color:#fff; font-weight:bold;">MINDÖSSZESEN:</span>
                    <span class="stat-val" style="color:var(--extra); font-size:17px;">${(extraSum + totalAllowances).toLocaleString('hu-HU')} Ft</span>
                </div>
            `;
        }

        bodyEl.innerHTML = html;
        navigateTo('view', 'month-summary-modal');
    }

    /* --- NYOMTATÁS --- */
    function printCurrentView() {
        const year = d.getFullYear();
        const monthIdx = d.getMonth();
        const lastDay = new Date(year, monthIdx + 1, 0).getDate();
        const wageKey = `wage_${year}_${monthIdx}_${mode}`;
        const currentWage = parseInt(wages[wageKey]) || 0;
        const monthAllowances = allowances[getMonthAllowancesKey()] || [];
        const totalAllowances = monthAllowances.reduce((sum, item) => sum + (parseInt(item.amount) || 0), 0);

        const modeTitles = {
            'round15': 'Havi Munkaidő Kimutatás (15p kerekítés)',
            'presence': 'Havi Jelenléti Ív',
            'extra': 'Havi Extra Bevételek Kimutatás'
        };

        let html = `<h2>${modeTitles[mode]} – ${year}. ${months[monthIdx]}</h2>`;
        html += `<p>Fiók: ${currentUser.name} | Nyomtatva: ${new Date().toLocaleDateString('hu-HU')}</p>`;

        if (mode === 'round15') {
            let totalHours = 0, totalBaseMoney = 0;
            html += `<table class="print-table">
                <tr>
                    <th>Dátum</th>
                    <th>Nap</th>
                    <th>Érkezés</th>
                    <th>Távozás</th>
                    <th>Ebédidő</th>
                    <th>Munkaidő</th>
                    <th>Napi bér</th>
                </tr>`;

            for (let day = 1; day <= lastDay; day++) {
                const entry = workData[`round15_${year}_${monthIdx}_${day}`];
                const dow = weekDaysFull[new Date(year, monthIdx, day).getDay()];
                if (entry) {
                    const hrs = parseFloat(entry.total || 0);
                    const dailyPay = Math.round(hrs * currentWage);
                    totalHours += hrs;
                    totalBaseMoney += dailyPay;

                    html += `<tr>
                        <td>${monthIdx + 1}. ${day}.</td>
                        <td>${dow}</td>
                        <td>${entry.start || '-'}</td>
                        <td>${entry.end || '-'}${entry.isNight ? ' (éjjel)' : ''}</td>
                        <td>${entry.hasBreak ? '-30p' : '-'}</td>
                        <td><b>${hrs.toFixed(2)} óra</b></td>
                        <td>${currentWage > 0 ? dailyPay.toLocaleString('hu-HU') + ' Ft' : '-'}</td>
                    </tr>`;
                }
            }
            html += `</table>`;

            html += `<div class="print-summary">
                <div><span>Órabér:</span><b>${currentWage.toLocaleString('hu-HU')} Ft / óra</b></div>
                <div><span>Összes ledolgozott óra:</span><b>${totalHours.toFixed(2)} óra</b></div>
                <div><span>Alapbér összesen:</span><b>${totalBaseMoney.toLocaleString('hu-HU')} Ft</b></div>`;
            monthAllowances.forEach(a => {
                if (a.name || a.amount) {
                    html += `<div><span>Egyéb (${a.name || 'Tétel'}):</span><b>${(parseInt(a.amount) || 0).toLocaleString('hu-HU')} Ft</b></div>`;
                }
            });
            html += `<div style="border-top:1px solid #999; padding-top:5px; margin-top:5px; font-size:15px;">
                    <span>VÁRHATÓ FIZETÉS ÖSSZESEN:</span><b>${(totalBaseMoney + totalAllowances).toLocaleString('hu-HU')} Ft</b>
                </div>
            </div>`;

        } else if (mode === 'presence') {
            let totalDays = 0;
            html += `<table class="print-table">
                <tr><th>Dátum</th><th>Nap</th><th>Státusz</th><th>Napidíj</th></tr>`;
            for (let day = 1; day <= lastDay; day++) {
                const entry = workData[`presence_${year}_${monthIdx}_${day}`];
                const dow = weekDaysFull[new Date(year, monthIdx, day).getDay()];
                if (entry) {
                    totalDays++;
                    html += `<tr>
                        <td>${monthIdx + 1}. ${day}.</td>
                        <td>${dow}</td>
                        <td>✓ Jelen</td>
                        <td>${currentWage > 0 ? currentWage.toLocaleString('hu-HU') + ' Ft' : '-'}</td>
                    </tr>`;
                }
            }
            html += `</table>`;
            const basePay = totalDays * currentWage;
            html += `<div class="print-summary">
                <div><span>Ledolgozott napok:</span><b>${totalDays} nap</b></div>
                <div><span>Napidíj összesen:</span><b>${basePay.toLocaleString('hu-HU')} Ft</b></div>
                <div><span>Egyéb bevételek:</span><b>${totalAllowances.toLocaleString('hu-HU')} Ft</b></div>
                <div style="border-top:1px solid #999; padding-top:5px; margin-top:5px; font-size:15px;">
                    <span>ÖSSZESEN:</span><b>${(basePay + totalAllowances).toLocaleString('hu-HU')} Ft</b>
                </div>
            </div>`;

        } else if (mode === 'extra') {
            let extraTotal = 0;
            html += `<table class="print-table">
                <tr><th>Dátum</th><th>Nap</th><th>Megjegyzés</th><th>Összeg</th></tr>`;
            for (let day = 1; day <= lastDay; day++) {
                const entry = workData[`extra_${year}_${monthIdx}_${day}`];
                const dow = weekDaysFull[new Date(year, monthIdx, day).getDay()];
                if (entry) {
                    const amt = parseInt(entry.amount || 0);
                    extraTotal += amt;
                    html += `<tr>
                        <td>${monthIdx + 1}. ${day}.</td>
                        <td>${dow}</td>
                        <td>${entry.note || '-'}</td>
                        <td><b>${amt.toLocaleString('hu-HU')} Ft</b></td>
                    </tr>`;
                }
            }
            html += `</table>`;
            html += `<div class="print-summary">
                <div><span>Extra tételek összesen:</span><b>${extraTotal.toLocaleString('hu-HU')} Ft</b></div>
                <div><span>Egyéb bevételek:</span><b>${totalAllowances.toLocaleString('hu-HU')} Ft</b></div>
                <div style="border-top:1px solid #999; padding-top:5px; margin-top:5px; font-size:15px;">
                    <span>MINDÖSSZESEN:</span><b>${(extraTotal + totalAllowances).toLocaleString('hu-HU')} Ft</b>
                </div>
            </div>`;
        }

        document.getElementById('print-area').innerHTML = html;
        window.print();
    }

    function printAnnualView() {
        const year = document.getElementById('year-select').value;
        const tableHtml = document.getElementById('annual-data').innerHTML;
        document.getElementById('print-area').innerHTML = `
            <h2>Éves Összesítő – ${year}</h2>
            <p>Fiók: ${currentUser.name} | Nyomtatva: ${new Date().toLocaleDateString('hu-HU')}</p>
            ${tableHtml.replace('class="annual-table"', 'class="print-table"')}
        `;
        window.print();
    }

    /* --- ÉVES TÁBLÁZAT (KÜLÖN EXTRA OSZLOPPAL ÉS PONTOS SZŰRÉSSEL) --- */
    function renderAnnual() {
        let year = document.getElementById('year-select').value;
        let html = '<table class="annual-table"><tr><th>Hó</th><th>15p</th><th>Jel.</th><th>Extra</th><th>Egyéb</th><th>Össz</th></tr>';
        let totals = { h15Ft: 0, jelFt: 0, extraFt: 0, allowanceFt: 0, ft: 0 };
        
        for(let m = 0; m < 12; m++) {
            let mData = { h15Ft: 0, jelFt: 0, extraFt: 0, allowanceFt: 0, ft: 0 };
            
            for(let k in workData) {
                if(!workData[k]) continue;
                if(k.startsWith(`round15_${year}_${m}_`)) {
                    let wage = parseInt(wages[`wage_${year}_${m}_round15`]) || 0;
                    mData.h15Ft += Math.round(parseFloat(workData[k].total || 0) * wage);
                }
                if(k.startsWith(`presence_${year}_${m}_`)) {
                    let wage = parseInt(wages[`wage_${year}_${m}_presence`]) || 0;
                    mData.jelFt += wage;
                }
                if(k.startsWith(`extra_${year}_${m}_`)) {
                    mData.extraFt += parseInt(workData[k].amount || 0);
                }
            }

            let monthAllowances = allowances[`allowances_${year}_${m}`] || [];
            monthAllowances.forEach(item => {
                mData.allowanceFt += parseInt(item.amount) || 0;
            });

            mData.ft = mData.h15Ft + mData.jelFt + mData.extraFt + mData.allowanceFt;
            
            html += `<tr><td>${months[m].substring(0,3)}</td><td>${mData.h15Ft.toLocaleString('hu-HU')}</td><td>${mData.jelFt.toLocaleString('hu-HU')}</td><td style="color:var(--extra)">${mData.extraFt.toLocaleString('hu-HU')}</td><td>${mData.allowanceFt.toLocaleString('hu-HU')}</td><td style="font-weight:bold">${mData.ft.toLocaleString('hu-HU')} Ft</td></tr>`;
            totals.h15Ft += mData.h15Ft; totals.jelFt += mData.jelFt; totals.extraFt += mData.extraFt; totals.allowanceFt += mData.allowanceFt; totals.ft += mData.ft;
        }
        html += `<tr style="border-top:2px solid white; font-weight:bold;"><td>ÖSSZ</td><td>${totals.h15Ft.toLocaleString('hu-HU')}</td><td>${totals.jelFt.toLocaleString('hu-HU')}</td><td style="color:var(--extra)">${totals.extraFt.toLocaleString('hu-HU')}</td><td>${totals.allowanceFt.toLocaleString('hu-HU')}</td><td>${totals.ft.toLocaleString('hu-HU')} Ft</td></tr></table>`;
        document.getElementById('annual-data').innerHTML = html;
    }

    function updateWageInputField() {
        let wageKey = `wage_${d.getFullYear()}_${d.getMonth()}_${mode}`;
        let currentWageValue = wages[wageKey] || "0";
        document.getElementById('wage-input').value = currentWageValue === "0" ? "" : parseInt(currentWageValue).toLocaleString('hu-HU').replace(/\u00A0/g, ' ') + " Ft";
    }

    function getMonthAllowancesKey() {
        return `allowances_${d.getFullYear()}_${d.getMonth()}`;
    }

    function renderAllowances() {
        let container = document.getElementById('allowances-container');
        let key = getMonthAllowancesKey();
        if(!allowances[key]) allowances[key] = [];
        
        let list = allowances[key];
        let html = "";
        
        list.forEach((item, index) => {
            let formattedAmt = item.amount ? parseInt(item.amount).toLocaleString('hu-HU').replace(/\u00A0/g, ' ') + " Ft" : "";
            html += `<div class="allowance-row">
                <input type="text" placeholder="Megnevezés (pl. Bérlet)" value="${item.name || ''}" oninput="updateAllowanceItem(${index}, 'name', this.value)">
                <input type="text" inputmode="numeric" placeholder="Összeg (Ft)" value="${formattedAmt}" oninput="formatCurrency(this); updateAllowanceItem(${index}, 'amount', this.value.replace(/\\D/g,''))">
                <button class="del-allowance" onclick="removeAllowance(${index})">✕</button>
            </div>`;
        });
        
        container.innerHTML = html;
        calculateTotal();
    }

    function addAllowanceField() {
        let key = getMonthAllowancesKey();
        if(!allowances[key]) allowances[key] = [];
        allowances[key].push({ name: "", amount: "" });
        renderAllowances();
    }

    function updateAllowanceItem(index, field, value) {
        let key = getMonthAllowancesKey();
        if(allowances[key] && allowances[key][index]) {
            allowances[key][index][field] = value;
            syncData();
            calculateTotal();
        }
    }

    async function removeAllowance(index) {
        let key = getMonthAllowancesKey();
        if(allowances[key]) {
            allowances[key].splice(index, 1);
            await syncData();
            renderAllowances();
        }
    }

    async function saveTime() {
        let s = document.getElementById('start-time').value, e = document.getElementById('end-time').value;
        if (s.includes(':') && e.includes(':')) {
            let sP = s.split(':'), eP = e.split(':');
            let startM = parseInt(sP[0])*60 + parseInt(sP[1]), endM = parseInt(eP[0])*60 + parseInt(eP[1]);
            let isNight = false;
            if (endM < startM) { endM += 1440; isNight = true; }
            let m = endM - startM;
            let hasBreak = document.getElementById('break-toggle').checked;
            if (hasBreak) m -= 30;
            if (m < 0) m = 0;
            let finalHrs = (m / 60);
            if (mode === 'round15') { finalHrs = (Math.round(m / 15) * 15) / 60; }
            workData[`${mode}_${d.getFullYear()}_${d.getMonth()}_${selectedDay}`] = { start: s, end: e, total: finalHrs.toFixed(2), isNight: isNight, hasBreak: hasBreak };
            await syncData();
        }
        goBack(); render();
    }

    async function saveExtra() {
        let amt = document.getElementById('extra-amount').value.replace(/\D/g, "");
        let note = document.getElementById('extra-note').value.trim();
        if (amt) {
            workData[`extra_${d.getFullYear()}_${d.getMonth()}_${selectedDay}`] = { amount: parseInt(amt), note: note };
            await syncData();
        }
        goBack(); render();
    }

    async function deleteEntry() {
        delete workData[`${mode}_${d.getFullYear()}_${d.getMonth()}_${selectedDay}`];
        await syncData(); 
        goBack(); 
        render();
    }

    function render() {
        document.getElementById('month-display').innerText = `${d.getFullYear()}. ${months[d.getMonth()]}`;
        const body = document.getElementById('calendar-body');
        let html = '<div class="grid-header"></div>' + ["H", "K", "Sze", "Cs", "P", "Szo", "V"].map(h => `<div class="grid-header">${h}</div>`).join('');
        let firstDay = new Date(d.getFullYear(), d.getMonth(), 1);
        let lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        let startShift = (firstDay.getDay() + 6) % 7;
        let dateCounter = 1;
        let wageKey = `wage_${d.getFullYear()}_${d.getMonth()}_${mode}`;
        let currentWage = parseInt(wages[wageKey]) || 0;

        for (let row = 0; row < 6; row++) {
            if (dateCounter > lastDay) break;
            html += `<div class="week-num">${getWeekNum(new Date(d.getFullYear(), d.getMonth(), dateCounter))}</div>`;
            for (let col = 0; col < 7; col++) {
                if ((row === 0 && col < startShift) || dateCounter > lastDay) { html += `<div></div>`; }
                else {
                    let key = `${mode}_${d.getFullYear()}_${d.getMonth()}_${dateCounter}`;
                    let entry = workData[key];
                    let val = "", cls = "day-val";
                    if(entry) {
                        if(mode==='presence') val = "✓";
                        else if(mode==='extra') { val = parseInt(entry.amount).toLocaleString('hu-HU').replace(/\u00A0/g, ' ') + " Ft"; cls += " extra"; }
                        else { 
                            let dailyMoney = Math.round(parseFloat(entry.total) * currentWage);
                            let moneyDisplay = dailyMoney > 0 ? `<br><span style="font-size:9px; color:var(--secondary); font-weight:normal;">${dailyMoney.toLocaleString('hu-HU').replace(/\u00A0/g, ' ')} Ft</span>` : "";
                            val = (entry.isNight ? "🌙 " : "") + entry.total + "ó" + moneyDisplay;
                        }
                    }
                    html += `<div class="day-cell" onclick="dayClick(${dateCounter})">${dateCounter}<div class="${cls}">${val}</div></div>`;
                    dateCounter++;
                }
            }
        }
        body.innerHTML = html;
        calculateTotal();
    }

    function calculateTotal() {
        let total = 0, money = 0, count = 0, prefix = `${mode}_${d.getFullYear()}_${d.getMonth()}_`;
        for(let k in workData) {
            if(k.startsWith(prefix) && workData[k]) {
                count++;
                if(mode === 'extra') money += parseInt(workData[k].amount || 0);
                else total += (mode==='presence' ? 1 : parseFloat(workData[k].total));
            }
        }
        
        let wageKey = `wage_${d.getFullYear()}_${d.getMonth()}_${mode}`;
        let w = parseInt(wages[wageKey]) || 0;
        let baseMoney = (mode === 'presence') ? (count * w) : (mode === 'extra' ? money : (total * w));

        let monthAllowances = allowances[getMonthAllowancesKey()] || [];
        let totalAllowances = monthAllowances.reduce((sum, item) => sum + (parseInt(item.amount) || 0), 0);

        let finalMoney = baseMoney + totalAllowances;

        if (mode === 'extra') {
            document.getElementById('total-count').innerText = count + " tétel";
            document.getElementById('total-money').innerText = finalMoney.toLocaleString('hu-HU').replace(/\u00A0/g, ' ') + " Ft";
            document.getElementById('total-money').style.color = "var(--extra)";
        } else {
            const unit = (mode === 'presence') ? " nap" : " óra";
            document.getElementById('total-count').innerText = (mode==='presence' ? count : total.toFixed(2)) + unit;
            document.getElementById('total-money').innerText = Math.round(finalMoney).toLocaleString('hu-HU').replace(/\u00A0/g, ' ') + " Ft";
            document.getElementById('total-money').style.color = "var(--success)";
        }
    }

    function dayClick(day) { 
        selectedDay = day; 
        if(mode==='presence') {
            let key = `${mode}_${d.getFullYear()}_${d.getMonth()}_${day}`;
            if (workData[key]) delete workData[key];
            else workData[key] = 1;
            syncData().then(render);
        }
        else if(mode==='extra') {
            let entry = workData[`extra_${d.getFullYear()}_${d.getMonth()}_${day}`] || {};
            document.getElementById('extra-modal-date').innerText = `${months[d.getMonth()]} ${day}. (Extra)`;
            document.getElementById('extra-amount').value = entry.amount ? entry.amount.toLocaleString('hu-HU').replace(/\u00A0/g, ' ') + " Ft" : "";
            document.getElementById('extra-note').value = entry.note || "";
            navigateTo('view', 'extra-modal');
        } else { 
            let entry = workData[`${mode}_${d.getFullYear()}_${d.getMonth()}_${day}`] || {};
            document.getElementById('modal-date').innerText = `${months[d.getMonth()]} ${day}.`;
            document.getElementById('start-time').value = entry.start || "";
            document.getElementById('end-time').value = entry.end || "";
            document.getElementById('break-toggle').checked = entry.hasBreak || false;
            navigateTo('view', 'time-modal');
        } 
    }

    function timeMask(i) { let v = i.value.replace(/\D/g, ""); if (v.length >= 3) { i.value = v.substring(0, 2) + ":" + v.substring(2, 4); } else { i.value = v; } }
    function formatCurrency(i) { let v = i.value.replace(/\D/g, ""); i.value = v ? parseInt(v).toLocaleString('hu-HU').replace(/\u00A0/g, ' ') + " Ft" : ""; }
    function changeMonth(n) { d.setMonth(d.getMonth() + n); updateWageInputField(); renderAllowances(); render(); }
    async function saveWages() { 
        let wageKey = `wage_${d.getFullYear()}_${d.getMonth()}_${mode}`; 
        wages[wageKey] = document.getElementById('wage-input').value.replace(/\D/g, "") || "0"; 
        await syncData(); 
        calculateTotal(); 
    }
    function showLoading(s) { document.getElementById('loading-overlay').style.display = s ? 'flex' : 'none'; }
    function getWeekNum(date) { let t = new Date(date.valueOf()); t.setDate(t.getDate() - ((date.getDay() + 6) % 7) + 3); let f = t.valueOf(); t.setMonth(0, 1); if (t.getDay() !== 4) t.setMonth(0, 1 + ((4 - t.getDay()) + 7) % 7); return 1 + Math.ceil((f - t) / 604800000); }
</script>
