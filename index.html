<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munkaidő & Bevétel PRO</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
            --danger: #ff453a; --success: #30d158; --extra: #bf5af2;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); -webkit-tap-highlight-color: transparent; }
        .container { max-width: 500px; margin: auto; background: #121212; padding: 20px; border-radius: 28px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.8); text-align: center; min-height: 90vh; box-sizing: border-box; }
        input, select { width: 100%; background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
        .main-btn { display: flex; align-items: center; justify-content: center; background: var(--card); color: white; padding: 18px; margin: 12px auto; border: 1px solid var(--border); border-radius: 16px; font-size: 16px; width: 100%; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .accent-btn { background: var(--accent); border: none; }
        .extra-btn { background: var(--extra); border: none; }
        .nav-row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; background: var(--card); padding: 10px 15px; border-radius: 14px; border: 1px solid var(--border); }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: 40px repeat(7, 1fr); gap: 6px; margin: 15px 0; }
        .grid-header { font-size: 11px; font-weight: bold; color: var(--accent); text-align: center; }
        .week-num { font-size: 10px; color: var(--secondary); align-self: center; text-align: center; }
        .day-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--card); min-height: 65px; border-radius: 12px; font-size: 14px; border: 1px solid var(--border); cursor: pointer; }
        .day-val { font-size: 9px; font-weight: bold; color: var(--success); margin-top: 4px; text-align: center; word-break: break-all; }
        .day-val.extra { color: var(--extra); }
        .summary-section { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; }
        .sum-full { grid-column: span 2; border-top: 1px solid var(--border); padding-top: 10px; }
        .salary-input { background: #000; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; width: 100%; font-size: 16px; box-sizing: border-box; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 24px; width: 85%; max-width: 320px; border: 1px solid var(--border); }
        #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: none; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .hidden { display: none !important; }
        .annual-table { width: 100%; border-collapse: collapse; margin-top: 15px; color: #fff; }
        .annual-table th, .annual-table td { padding: 8px; border-bottom: 1px solid #333; text-align: center; font-size: 13px; }
        .annual-table th { color: var(--secondary); font-size: 11px; }
    </style>
</head>
<body>

<div id="loading-overlay">Szinkronizálás...</div>

<div id="login-screen" class="container">
    <h2 style="margin-bottom:20px">Munkaidő Belépés</h2>
    <input type="text" id="login-user" placeholder="Felhasználónév" value="Jani">
    <input type="password" id="login-pass" placeholder="Jelszó">
    <button class="main-btn accent-btn" onclick="handleLogin()">BELÉPÉS</button>
</div>

<div id="page-main" class="container hidden">
    <div id="user-info" style="font-size:12px; color:var(--secondary); margin-bottom:10px"></div>
    <h1 style="margin-bottom:25px">Főmenü</h1>
    <button class="main-btn" onclick="openPage('round15')">⏱️ 15p Kerekítés</button>
    <button class="main-btn" onclick="openPage('presence')">📅 Jelenlét (✓)</button>
    <button class="main-btn extra-btn" onclick="openPage('extra')">💰 Extra bevétel</button>
    <button class="main-btn" onclick="openAnnualPage()">📊 Összesítő</button>
    <button class="main-btn" style="background:none; color:var(--danger); border:none; margin-top:20px" onclick="logout()">Kijelentkezés</button>
</div>

<div id="page-view" class="container hidden">
    <h2 id="view-title" style="margin:0 0 15px 0"></h2>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span id="month-display" style="font-weight:bold"></span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>
    <div class="calendar-grid" id="calendar-body"></div>
    <div class="summary-section">
        <div class="sum-box" id="wage-box">
            <span id="label-wage" style="font-size:10px; color:var(--secondary)">ÓRABÉR</span>
            <input type="text" id="wage-input" class="salary-input" placeholder="0 Ft" oninput="formatCurrency(this); saveWages();">
        </div>
        <div class="sum-box">
            <span id="label-total" style="font-size:10px; color:var(--secondary)">ÓRÁK</span>
            <div id="total-count" style="font-size: 20px; font-weight: bold; margin-top:5px">0</div>
        </div>
        <div class="sum-box sum-full">
            <span id="label-result" style="font-size:10px; color:var(--secondary)">VÁRHATÓ FIZETÉS</span>
            <div id="total-money" style="font-size: 24px; font-weight: bold; color: var(--success);">0 Ft</div>
        </div>
    </div>
    <button class="main-btn" style="margin-top:20px" onclick="backToMenu()">Vissza a menübe</button>
</div>

<div id="page-annual" class="container hidden">
    <h2>Éves Összesítő</h2>
    <select id="year-select" onchange="renderAnnual()"></select>
    <div id="annual-data" style="margin-top:15px;"></div>
    <button class="main-btn" style="margin-top:20px" onclick="backToMenu()">Vissza a menübe</button>
</div>

<div id="time-modal" class="modal">
    <div class="modal-content">
        <h3 id="modal-date"></h3>
        <input type="text" id="start-time" inputmode="numeric" placeholder="Érkezés (18:30)" maxlength="5" onkeyup="timeMask(this)">
        <input type="text" id="end-time" inputmode="numeric" placeholder="Távozás (02:30)" maxlength="5" onkeyup="timeMask(this)">
        <div style="display:flex; justify-content:space-between; align-items:center; margin:15px 0">
            <span>Ebédidő (-30p)</span>
            <input type="checkbox" id="break-toggle" style="width:25px; height:25px">
        </div>
        <button class="main-btn accent-btn" onclick="saveTime()">MENTÉS</button>
        <button class="main-btn" style="background:none; border:none; color:var(--danger)" onclick="deleteEntry('time-modal')">Törlés</button>
        <button class="main-btn" style="background:none; border:none" onclick="closeModal('time-modal')">Mégse</button>
    </div>
</div>

<div id="extra-modal" class="modal">
    <div class="modal-content">
        <h3 id="extra-modal-date"></h3>
        <input type="text" id="extra-amount" inputmode="numeric" placeholder="Összeg (Ft)" oninput="formatCurrency(this)">
        <input type="text" id="extra-note" placeholder="Megjegyzés (pl. Fusi, Tippmix)">
        <button class="main-btn extra-btn" onclick="saveExtra()">MENTÉS</button>
        <button class="main-btn" style="background:none; border:none; color:var(--danger)" onclick="deleteEntry('extra-modal')">Törlés</button>
        <button class="main-btn" style="background:none; border:none" onclick="closeModal('extra-modal')">Mégse</button>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
    const DB_URL = "https://kiadaskoveto-2e474-default-rtdb.firebaseio.com/";
    let currentUser = JSON.parse(localStorage.getItem('work_session'));
    let workData = {}, wages = {}, d = new Date(), mode = 'presence', selectedDay = null;
    const months = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];

    async function handleLogin() {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value.trim();
        if(!u || !p) { alert("Töltsd ki a mezőket!"); return; }
        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}users_auth/${u}.json`);
            let storedPass = await res.json();
            if(storedPass && String(storedPass).replace(/"/g, '') === String(p)) {
                currentUser = { name: u };
                localStorage.setItem('work_session', JSON.stringify(currentUser));
                initApp();
            } else { alert("Hibás adatok!"); }
        } catch(e) { alert("Hálózati hiba a belépés során!"); }
        showLoading(false);
    }

    async function initApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('page-main').classList.remove('hidden');
        document.getElementById('user-info').innerText = `USER: ${currentUser.name.toUpperCase()}`;
        await loadRemoteData();
    }

    async function loadRemoteData() {
        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}work_data/${currentUser.name}.json`);
            const data = await res.json();
            if(data) { workData = data.entries || {}; wages = data.wages || {}; }
        } catch(e) { console.log("Offline mód vagy hiba betöltéskor."); }
        showLoading(false); render();
    }

    async function syncData() {
        try {
            await fetch(`${DB_URL}work_data/${currentUser.name}.json`, { method: 'PUT', body: JSON.stringify({ entries: workData, wages: wages }) });
        } catch(e) { console.log("Sikertelen szinkronizálás (offline)."); }
    }

    function openPage(m) {
        mode = m; 
        document.getElementById('page-main').classList.add('hidden'); 
        document.getElementById('page-view').classList.remove('hidden');
        document.getElementById('page-annual').classList.add('hidden');
        updateWageInputField();
        render();
    }

    // ÚJ: Éves összesítő megnyitása
    function openAnnualPage() {
        document.getElementById('page-main').classList.add('hidden');
        document.getElementById('page-annual').classList.remove('hidden');
        let select = document.getElementById('year-select');
        select.innerHTML = '<option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option>';
        select.value = new Date().getFullYear();
        renderAnnual();
    }

    // ÚJ: Éves összesítő renderelése
    function renderAnnual() {
        let year = document.getElementById('year-select').value;
        let html = '<table class="annual-table"><tr><th>Hó</th><th>15p</th><th>Jel.</th><th>Extra</th><th>Össz</th></tr>';
        let totals = { h15: 0, jel: 0, extra: 0, ft: 0 };
        for(let m = 0; m < 12; m++) {
            let mData = { h15: 0, jel: 0, extra: 0 };
            for(let k in workData) {
                if(k.startsWith(`round15_${year}_${m}_`)) mData.h15 += parseFloat(workData[k].total || 0);
                if(k.startsWith(`presence_${year}_${m}_`)) mData.jel += 1;
                if(k.startsWith(`extra_${year}_${m}_`)) mData.extra += parseInt(workData[k].amount || 0);
            }
            let wage = parseInt(wages[`wage_${year}_${m}_round15`]) || 0;
            let monthFt = Math.round(mData.h15 * wage) + mData.extra;
            html += `<tr><td>${months[m].substring(0,3)}</td><td>${mData.h15.toFixed(1)}</td><td>${mData.jel}</td><td>${mData.extra.toLocaleString()}</td><td style="font-weight:bold">${monthFt.toLocaleString()}</td></tr>`;
            totals.h15 += mData.h15; totals.jel += mData.jel; totals.extra += mData.extra; totals.ft += monthFt;
        }
        html += `<tr style="border-top:2px solid white; font-weight:bold;"><td>ÖSSZ</td><td>${totals.h15.toFixed(1)}</td><td>${totals.jel}</td><td>${totals.extra.toLocaleString()}</td><td>${totals.ft.toLocaleString()}</td></tr></table>`;
        document.getElementById('annual-data').innerHTML = html;
    }

    function updateWageInputField() {
        let wageKey = `wage_${d.getFullYear()}_${d.getMonth()}_${mode}`;
        let currentWageValue = wages[wageKey] || "0";
        document.getElementById('wage-input').value = currentWageValue === "0" ? "" : parseInt(currentWageValue).toLocaleString('hu-HU') + " Ft";
    }

    async function saveTime() {
        let s = document.getElementById('start-time').value, e = document.getElementById('end-time').value;
        if (s.includes(':') && e.includes(':')) {
            let sP = s.split(':'), eP = e.split(':');
            let startM = parseInt(sP[0])*60 + parseInt(sP[1]), endM = parseInt(eP[0])*60 + parseInt(eP[1]);
            let isNight = false;
            if (endM < startM) { endM += 1440; isNight = true; }
            let m = endM - startM;
            let hasBreak = document.getElementById('break-toggle').checked;
            if (hasBreak) m -= 30;
            if (m < 0) m = 0;
            let finalHrs = (m / 60);
            if (mode === 'round15') { finalHrs = (Math.round(m / 15) * 15) / 60; }
            workData[`${mode}_${d.getFullYear()}_${d.getMonth()}_${selectedDay}`] = { start: s, end: e, total: finalHrs.toFixed(2), isNight: isNight, hasBreak: hasBreak };
            await syncData();
        }
        closeModal('time-modal'); render();
    }

    async function saveExtra() {
        let amt = document.getElementById('extra-amount').value.replace(/\D/g, "");
        let note = document.getElementById('extra-note').value.trim();
        if (amt) {
            workData[`extra_${d.getFullYear()}_${d.getMonth()}_${selectedDay}`] = { amount: parseInt(amt), note: note };
            await syncData();
        }
        closeModal('extra-modal'); render();
    }

    async function deleteEntry(modalId) {
        delete workData[`${mode}_${d.getFullYear()}_${d.getMonth()}_${selectedDay}`];
        await syncData(); 
        closeModal(modalId); 
        render();
    }

    function render() {
        document.getElementById('month-display').innerText = `${d.getFullYear()}. ${months[d.getMonth()]}`;
        const body = document.getElementById('calendar-body');
        let html = '<div class="grid-header"></div>' + ["H", "K", "Sze", "Cs", "P", "Szo", "V"].map(h => `<div class="grid-header">${h}</div>`).join('');
        let firstDay = new Date(d.getFullYear(), d.getMonth(), 1);
        let lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        let startShift = (firstDay.getDay() + 6) % 7;
        let dateCounter = 1;
        let wageKey = `wage_${d.getFullYear()}_${d.getMonth()}_${mode}`;
        let currentWage = parseInt(wages[wageKey]) || 0;
        for (let row = 0; row < 6; row++) {
            if (dateCounter > lastDay) break;
            html += `<div class="week-num">${getWeekNum(new Date(d.getFullYear(), d.getMonth(), dateCounter))}</div>`;
            for (let col = 0; col < 7; col++) {
                if ((row === 0 && col < startShift) || dateCounter > lastDay) { html += `<div></div>`; }
                else {
                    let key = `${mode}_${d.getFullYear()}_${d.getMonth()}_${dateCounter}`;
                    let entry = workData[key];
                    let val = "", cls = "day-val";
                    if(entry) {
                        if(mode==='presence') val = "✓";
                        else if(mode==='extra') { val = parseInt(entry.amount).toLocaleString('hu-HU') + " Ft"; cls += " extra"; }
                        else { 
                            let dailyMoney = Math.round(parseFloat(entry.total) * currentWage);
                            let moneyDisplay = dailyMoney > 0 ? `<br><span style="font-size:9px; color:var(--secondary); font-weight:normal;">${dailyMoney.toLocaleString('hu-HU')}</span>` : "";
                            val = (entry.isNight ? "🌙 " : "") + entry.total + "ó" + moneyDisplay;
                        }
                    }
                    html += `<div class="day-cell" onclick="dayClick(${dateCounter})">${dateCounter}<div class="${cls}">${val}</div></div>`;
                    dateCounter++;
                }
            }
        }
        body.innerHTML = html;
        calculateTotal();
    }

    function calculateTotal() {
        let total = 0, money = 0, count = 0, prefix = `${mode}_${d.getFullYear()}_${d.getMonth()}_`;
        for(let k in workData) {
            if(k.startsWith(prefix) && workData[k]) {
                count++;
                if(mode === 'extra') money += parseInt(workData[k].amount || 0);
                else total += (mode==='presence' ? 1 : parseFloat(workData[k].total));
            }
        }
        if (mode === 'extra') {
            document.getElementById('total-count').innerText = count + " tétel";
            document.getElementById('total-money').innerText = money.toLocaleString('hu-HU') + " Ft";
            document.getElementById('total-money').style.color = "var(--extra)";
        } else {
            const unit = (mode === 'presence') ? " nap" : " óra";
            document.getElementById('total-count').innerText = (mode==='presence' ? total : total.toFixed(2)) + unit;
            let wageKey = `wage_${d.getFullYear()}_${d.getMonth()}_${mode}`;
            let w = parseInt(wages[wageKey]) || 0;
            document.getElementById('total-money').innerText = Math.round(total * w).toLocaleString('hu-HU') + " Ft";
            document.getElementById('total-money').style.color = "var(--success)";
        }
    }

    function dayClick(day) { 
        selectedDay = day; 
        if(mode==='presence') { let key=`${mode}_${d.getFullYear()}_${d.getMonth()}_${day}`; workData[key]=workData[key]?null:1; syncData().then(render); }
        else if(mode==='extra') {
            let entry = workData[`extra_${d.getFullYear()}_${d.getMonth()}_${day}`] || {};
            document.getElementById('extra-modal-date').innerText = `${months[d.getMonth()]} ${day}. (Extra)`;
            document.getElementById('extra-amount').value = entry.amount ? entry.amount.toLocaleString('hu-HU') + " Ft" : "";
            document.getElementById('extra-note').value = entry.note || "";
            document.getElementById('extra-modal').style.display='flex';
        } else { 
            let entry = workData[`${mode}_${d.getFullYear()}_${d.getMonth()}_${day}`] || {};
            document.getElementById('modal-date').innerText = `${months[d.getMonth()]} ${day}.`;
            document.getElementById('start-time').value = entry.start || "";
            document.getElementById('end-time').value = entry.end || "";
            document.getElementById('break-toggle').checked = entry.hasBreak || false;
            document.getElementById('time-modal').style.display='flex'; 
        } 
    }

    function timeMask(i) { let v = i.value.replace(/\D/g, ""); if (v.length >= 3) { i.value = v.substring(0, 2) + ":" + v.substring(2, 4); } else { i.value = v; } }
    function formatCurrency(i) { let v = i.value.replace(/\D/g, ""); i.value = v ? parseInt(v).toLocaleString('hu-HU') + " Ft" : ""; }
    function changeMonth(n) { d.setMonth(d.getMonth() + n); updateWageInputField(); render(); }
    async function saveWages() { let wageKey = `wage_${d.getFullYear()}_${d.getMonth()}_${mode}`; wages[wageKey] = document.getElementById('wage-input').value.replace(/\D/g, "") || "0"; await syncData(); render(); }
    function backToMenu() { document.getElementById('page-view').classList.add('hidden'); document.getElementById('page-annual').classList.add('hidden'); document.getElementById('page-main').classList.remove('hidden'); }
    function logout() { localStorage.removeItem('work_session'); location.reload(); }
    function showLoading(s) { document.getElementById('loading-overlay').style.display = s ? 'flex' : 'none'; }
    function getWeekNum(date) { let t = new Date(date.valueOf()); t.setDate(t.getDate() - ((date.getDay() + 6) % 7) + 3); let f = t.valueOf(); t.setMonth(0, 1); if (t.getDay() !== 4) t.setMonth(0, 1 + ((4 - t.getDay()) + 7) % 7); return 1 + Math.ceil((f - t) / 604800000); }
    if(currentUser) initApp();
</script>
</body>
</html>
