<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munkaidő</title>
    <style>
        :root {
            --bg: #0f0f0f; --card: #1a1a1a; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .container { max-width: 450px; margin: auto; background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid var(--border); text-align: center; }
        h1 { font-size: 22px; margin-bottom: 25px; }
        
        /* Navigációs sorok */
        .nav-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; background: #262626; padding: 10px 15px; border-radius: 12px; }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; padding: 0 10px; }
        .nav-label { font-weight: 500; min-width: 120px; }

        /* Napok stílusa */
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 20px; font-size: 12px; color: var(--secondary); }
        .date-display { font-size: 28px; font-weight: bold; margin: 20px 0; color: var(--accent); }
        
        /* Checkbox */
        .check-container { margin: 20px 0; }
        input[type="checkbox"] { width: 40px; height: 40px; cursor: pointer; accent-color: var(--accent); }

        .main-btn { width: 100%; background: #262626; color: white; padding: 18px; margin: 10px 0; border: 1px solid var(--border); border-radius: 16px; cursor: pointer; font-size: 16px; }
        .hidden { display: none; }
        .back-btn { background: transparent; color: var(--secondary); margin-top: 20px; border: 1px solid #333; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="main-menu">
    <h1>Munkaidő</h1>
    <button class="main-btn" onclick="alert('Kerekítés funkció...')">⏱️ 15p kerekítés</button>
    <button class="main-btn" onclick="alert('Kerekítés funkció...')">⏳ 30p kerekítés</button>
    <button class="main-btn" onclick="showPresence()">📅 Jelenlét</button>
</div>

<div class="container hidden" id="presence-screen">
    <div class="nav-row">
        <button class="nav-btn" onclick="changeYear(-1)">❮</button>
        <span class="nav-label" id="year-val">2026</span>
        <button class="nav-btn" onclick="changeYear(1)">❯</button>
    </div>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span class="nav-label" id="month-val">Január</span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>
    <div class="nav-row">
        <button class="nav-btn" onclick="changeWeek(-1)">❮</button>
        <span class="nav-label" id="week-val">1. hét</span>
        <button class="nav-btn" onclick="changeWeek(1)">❯</button>
    </div>

    <div class="days-grid">
        <span>H</span><span>K</span><span>Sze</span><span>Cs</span><span>P</span><span>Szo</span><span>V</span>
    </div>
    
    <div class="date-display" id="date-val">2026.01.14</div>
    
    <div class="check-container">
        <input type="checkbox" id="presence-check">
        <div style="margin-top: 8px; font-size: 14px; color: var(--secondary);">Jelenlét rögzítése</div>
    </div>

    <button class="back-btn" onclick="location.reload()">Vissza</button>
</div>

<script>
    let d = new Date();
    const months = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];

    function showPresence() {
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('presence-screen').classList.remove('hidden');
        updateUI();
    }

    function changeYear(n) { d.setFullYear(d.getFullYear() + n); updateUI(); }
    function changeMonth(n) { d.setMonth(d.getMonth() + n); updateUI(); }
    function changeWeek(n) { d.setDate(d.getDate() + (n * 7)); updateUI(); }

    function getWeekNumber(date) {
        let tempDate = new Date(date.getTime());
        tempDate.setHours(0, 0, 0, 0);
        tempDate.setDate(tempDate.getDate() + 3 - (tempDate.getDay() + 6) % 7);
        let week1 = new Date(tempDate.getFullYear(), 0, 4);
        return 1 + Math.round(((tempDate.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    }

    function updateUI() {
        document.getElementById('year-val').innerText = d.getFullYear();
        document.getElementById('month-val').innerText = months[d.getMonth()];
        document.getElementById('week-val').innerText = getWeekNumber(d) + ". hét";
        document.getElementById('date-val').innerText = d.toISOString().split('T')[0].replace(/-/g, '.');
    }
</script>

</body>
</html>
